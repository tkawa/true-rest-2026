<h1 id="tkawa">@tkawa</h1>
<div class="cols w40 me"><div>
<img class="avatar sm" src="images/talks/tkawa-avatar.jpg" alt="" />
<p><strong>川村 徹（Toru Kawamura）</strong></p>
<ul>
<li>株式会社ソニックガーデン</li>
<li>RESTおじさん（RESTafarian）</li>
<li>Sendagaya.rb 主催<br /><span class="note">w/ @fukajun　毎週月曜 21:00- online</span><br /><small><a href="https://sendagayarb.doorkeeper.jp/">https://sendagayarb.doorkeeper.jp/</a></small></li>
</ul>
</div><div>
<p class="covers-h">RESTやハイパーメディアについての発表が多い</p>
<div class="covers"><div class="row"><figure class="w43"><img src="images/talks/rubykaigi2013.jpg" alt="Rails Gems realize RESTful modeling patterns" /><figcaption>RubyKaigi 2013</figcaption></figure><figure class="w43"><img src="images/talks/rubykaigi2014.jpg" alt="Hypermedia: The Missing Element" /><figcaption>RubyKaigi 2014</figcaption></figure><figure class="w169"><img src="images/talks/rubykaigi2016.jpg" alt="Web Clients for Ruby" /><figcaption>RubyKaigi 2016</figcaption></figure></div><div class="row"><figure class="w43 hl"><img src="images/talks/heiseirubykaigi01-2019.jpg" alt="真のREST" /><figcaption>平成Ruby会議01（2019）<b>今日はこの2026年版</b></figcaption></figure><figure class="w169"><img src="images/talks/kaigionrails2024.jpg" alt="Cache to Your Advantage" /><figcaption>Kaigi on Rails 2024</figcaption></figure></div></div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="3" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest2000%E5%B9%B4">REST（2000年-）</h1>
<div class="cols"><div>
<ul>
<li>REST API？</li>
<li>GraphQL？　gRPC？　tRPC？</li>
<li>React Server Components (RSC)？</li>
<li>MCP？</li>
<li>…</li>
</ul>
</div><div class="card">
<p>2019年（平成Ruby会議01「真のREST」）<br />
<br /><strong>「RESTはもう古い、いまは○○だ」</strong></p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="4" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E6%8A%80%E8%A1%93%E3%81%AE%E8%9E%BA%E6%97%8B">技術の「螺旋」</h1>
<div class="cols w66"><div class="fig sm"><img src="images/spiral-2025.jpg" /></div><div class="card">
<ul>
<li>技術の変化は<strong>振り子</strong>に<br />見えるが、実は<strong>螺旋</strong></li>
<li>同じところには<br />戻ってこない</li>
<li>見るべきは <em>差分</em> と、<br />それを可能にした技術</li>
</ul>
<p>REST：SOAP対RESTを乗り越え、26年生きている「螺旋のベース」</p>
</div></div>
<p><cite class="src">@t_wada「技術選定の審美眼（2025年版）」 <a href="https://speakerdeck.com/twada/understanding-the-spiral-of-technologies-2025-edition">https://speakerdeck.com/twada/understanding-the-spiral-of-technologies-2025-edition</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="sonicgarden" lang="ja-JP" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%A8%E3%81%AFbrurl%E8%A8%AD%E8%A8%88%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%84">RESTとは<br />URL設計ではない</h1>
<p>名詞は複数形、動詞を含めない……は命名の慣習</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="section" data-theme="sonicgarden" lang="ja-JP" class="section" data-marpit-pagination="6" style="--paginate:true;--class:section;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%A8%E3%81%AFbrcrud%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%84">RESTとは<br />CRUDではない</h1>
<p>HTTPメソッドとCRUD（Create/Read/Update/Delete）の対応づけは、RESTの定義ではない</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="7" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="crud%E3%81%AFrails%E3%81%AE%E8%A6%8F%E7%B4%84rest%E3%81%AFweb%E3%81%AE%E5%88%B6%E7%B4%84">CRUDはRailsの規約、RESTはWebの制約</h1>
<div class="cols"><div class="card"><div class="card-h">CRUDの規約（Rails 1.2, 2007）</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ruby">resources <span class="hljs-symbol">:articles</span>
</code></pre>
<ul>
<li>7つのアクションに収める</li>
<li>設計を縛り、一貫性と生産性を得る</li>
<li>RESTに触発されてDHHがRailsに持ち込んだ<br /><strong>RESTから生まれた規約だが、RESTそのものではない</strong></li>
</ul>
</div><div class="card"><div class="card-h">RESTの制約（Fielding, 2000）</div>
<ul>
<li>Webのような<strong>分散システム</strong>を成立させる<br />アーキテクチャ上の<strong>9つの制約の集合</strong></li>
<li>メソッドの数や対応づけは本質ではない</li>
<li>HTMLのフォームは <strong>GETとPOSTだけ</strong><br />
→ それでもWebはRESTを満たす</li>
</ul>
</div></div>
<div class="lead sm">
<p>Railsの規約を守ることと、RESTの制約を満たすことは、<strong>別の話</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="fielding-history" data-theme="sonicgarden" lang="ja-JP" class="fielding-history" data-marpit-pagination="8" style="--paginate:true;--class:fielding-history;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%AE%E7%94%9F%E3%81%BF%E3%81%AE%E8%A6%AA-roy-t-fielding">RESTの生みの親　Roy T. Fielding</h1>
<div class="history-intro"><div>Webを作った人が、<br /><strong>Webの構造を分析した</strong></div><img src="images/fielding.jpg" alt="Roy T. Fielding" /></div>
<div class="history-timeline"><div><b>1995ごろ</b><i></i><span>Apache</span><small>共同創設</small></div><div><b>1996</b><i></i><span>HTTP/1.0</span><small>RFC 1945 共著</small></div><div><b>1997</b><i></i><span>HTTP/1.1</span><small>RFC 2068 筆頭著者</small></div><div class="rest-origin"><b>2000</b><i></i><span>REST</span><small>博士論文で定義</small></div><div><b>2022</b><i></i><span>HTTP共通<br />セマンティクス</span><small>RFC 9110 共同編者</small></div><div><b>2025</b><i></i><span>QUERY</span><small>仕様案をレビュー</small></div></div>
<p><cite class="src">写真：<a href="https://roy.gbiv.com/">https://roy.gbiv.com/</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="9" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%A8%E3%81%AF9%E3%81%A4%E3%81%AE%E5%88%B6%E7%B4%84constraints">RESTとは9つの制約（Constraints）</h1>
<div class="rest"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"></div></div><div class="layer http"><b>HTTP</b><div class="cs"></div></div><div class="layer url"><b>URL</b><div class="cs"></div></div><span class="tag">REST</span></div><div class="js">JavaScript</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="10" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%A8%E3%81%AF9%E3%81%A4%E3%81%AE%E5%88%B6%E7%B4%84constraints-1">RESTとは9つの制約（Constraints）</h1>
<div class="rest"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>表現を通した<br />リソースの操作</span><span>自己記述的<br />メッセージ</span><span>ハイパー<br />メディア</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>クライアント<br />／サーバ</span><span>ステートレス</span><span>キャッシュ</span><span>階層化</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>リソースの識別</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>コードオンデマンド<br />（オプション）</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="11" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest%E3%81%A8%E3%81%AF9%E3%81%A4%E3%81%AE%E5%88%B6%E7%B4%84constraints-2">RESTとは9つの制約（Constraints）</h1>
<div class="rest focus"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>表現を通した<br />リソースの操作</span><span>自己記述的<br />メッセージ</span><span>ハイパー<br />メディア</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>クライアント<br />／サーバ</span><span>ステートレス</span><span>キャッシュ</span><span>階層化</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>リソースの識別</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>コードオンデマンド<br />（オプション）</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="12" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E8%A1%A8%E7%8F%BE%E3%82%92%E9%80%9A%E3%81%97%E3%81%9F%E3%83%AA%E3%82%BD%E3%83%BC%E3%82%B9%E3%81%AE%E6%93%8D%E4%BD%9C">表現を通したリソースの操作</h1>
<div class="cols w40"><div>
<ul>
<li>HTMLやJSONはリソースそのものではなく<br />リソースの<strong>表現</strong>（Representation）</li>
<li>REST = <strong>RE</strong>presentational <strong>S</strong>tate <strong>T</strong>ransfer</li>
<li>表現を受け取って<strong>読み</strong>、表現を送って<strong>変える</strong></li>
</ul>
</div><div class="card tight">
<div class="figure"><img src="figures/fig-representation.svg" alt="クライアントはGETでHTML文書という表現を受け取り、フォームの表現を送って記事を変える。リソースそのものはサーバにあり、URLで識別される" /></div>
<p>リソースそのものには触らず、<strong>表現</strong>を送り合う</p>
</div></div>
<div class="footnote">
<p>※ フォームの表現： <code>application/x-www-form-urlencoded</code>、 <code>multipart/form-data</code>など<br />
HTMLのフォームではPOSTだが、Railsが <code>_method</code> を読んでPUT/PATCHとして扱う（Railsの規約）</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="13" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E8%A1%A8%E7%8F%BE%E3%82%92%E9%81%B8%E6%8A%9E%E3%81%A7%E3%81%8D%E3%82%8B">表現を選択できる</h1>
<div class="cols w60"><div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ruby"><span class="hljs-keyword">def</span> <span class="hljs-title function_">show</span>
  <span class="hljs-variable">@article</span> = <span class="hljs-title class_">Article</span>.find(params[<span class="hljs-symbol">:id</span>])
  respond_to <span class="hljs-keyword">do</span> |<span class="hljs-params">format</span>|
    format.html <span class="hljs-comment"># text/html</span>
    format.json <span class="hljs-comment"># application/json</span>
    format.md   <span class="hljs-comment"># text/markdown (Rails 8.1〜)</span>
  <span class="hljs-keyword">end</span>
<span class="hljs-keyword">end</span>
</code></pre>
</div><div>
<pre class="http"><code><span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: text/html
<span class="res"><span class="mk">&lt;</span> Content-Type: text/html</span>

<span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: application/json
<span class="res"><span class="mk">&lt;</span> Content-Type: application/json</span>

<span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: text/markdown
<span class="res"><span class="mk">&lt;</span> Content-Type: text/markdown</span></code></pre>
<p><code>Accept</code> ヘッダによる<br /><strong>コンテントネゴシエーション</strong></p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="14" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E8%87%AA%E5%B7%B1%E8%A8%98%E8%BF%B0%E7%9A%84%E3%83%A1%E3%83%83%E3%82%BB%E3%83%BC%E3%82%B8">自己記述的メッセージ</h1>
<div class="cols"><div>
<ul>
<li>メッセージ単体で、解釈に必要な情報をすべて含む</li>
<li><code>Content-Type: text/html</code> <br />と自ら<strong>名乗る</strong></li>
<li>キャッシュしてよい？ 期間は？<br /><code>Cache-Control: max-age=3600</code><br />＝3600秒キャッシュしてよい</li>
</ul>
</div><div class="card tight">
<p><img src="images/cache.png" alt="" /></p>
</div></div>
<div class="detail">
<blockquote>
<p>最高のパフォーマンスは<strong>ネットワークを使わない</strong>ときに得られる — Fielding (2000)</p>
</blockquote>
</div>
<div class="footnote">
<p>※ 運ぶ仕組みはHTTPのヘッダ。ただし何を名乗るか、キャッシュしてよいかは表現ごとに決まる（<code>Content-Type</code>、<code>ETag</code>）</p>
</div>
<p><cite class="src">画像：<a href="https://speakerdeck.com/koriym/rest-6-plus-4falsezhi-yue">https://speakerdeck.com/koriym/rest-6-plus-4falsezhi-yue</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="15" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%83%8F%E3%82%A4%E3%83%91%E3%83%BC%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2-%EF%BC%9D-%E3%83%8F%E3%82%A4%E3%83%91%E3%83%BC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88">ハイパーメディア　＝　ハイパーテキスト</h1>
<div class="cols w40"><div class="card tight">
<p><img src="images/messages.png" alt="" /></p>
</div><div>
<ul>
<li><strong>ハイパーテキスト</strong>：複数のテキスト文書を相互にリンクで結びつけたもの　<strong>HT</strong>ML / <strong>HT</strong>TP</li>
<li><strong>ハイパーメディア</strong>：対象をテキストに限らない<br />画像・動画・<strong>フォーム</strong>なども含めた呼び名</li>
<li>各レスポンスは、<strong>次に何ができるか</strong>の<br />「メニュー」を含む（リンクとフォーム）</li>
<li>クライアントはあらかじめURLを<br />知っている必要がない</li>
<li>私たちがブラウザで毎日やっていること</li>
</ul>
</div></div>
<div class="flow"><span>ページを読む</span><i></i><span>リンクかフォームを選ぶ</span><i></i><span>送信する</span><i></i><span>次のページを読む</span></div>
<p><cite class="src">Leonard Richardson, Mike Amundsen &quot;RESTful Web APIs&quot; (2013)</cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="16" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-api%E3%81%AF%E3%83%8F%E3%82%A4%E3%83%91%E3%83%BC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E9%A7%86%E5%8B%95%E3%81%A7%E3%81%AA%E3%81%91%E3%82%8C%E3%81%B0%E3%81%AA%E3%82%89%E3%81%AA%E3%81%84">REST APIはハイパーテキスト駆動でなければならない</h1>
<div class="cols w60"><div>
<div class="quote lg">
<p>アプリケーション状態のエンジン（つまりAPI）が<strong>ハイパーテキストによって駆動されていない</strong>なら、それはRESTfulではないし、REST APIではない。<em>以上。</em></p>
</div>
<div class="quote-en">
<p>if the engine of application state (and hence the API) is not being driven by hypertext, then it cannot be RESTful and cannot be a REST API. Period.</p>
</div>
</div><div class="card tight">
<p><img src="images/untangled.jpg" alt="" /></p>
</div></div>
<p><cite class="src">Roy T. Fielding &quot;REST APIs must be hypertext-driven&quot; (2008) <a href="https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven">https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="17" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%B8%8A%E6%AE%B5%E3%81%AE3%E3%81%A4%E3%82%92%E3%81%BE%E3%81%A8%E3%82%81%E3%82%8B%E3%81%A8">上段の3つをまとめると</h1>
<div class="rest focus"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>表現を通した<br />リソースの操作</span><span>自己記述的<br />メッセージ</span><span>ハイパー<br />メディア</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>クライアント<br />／サーバ</span><span>ステートレス</span><span>キャッシュ</span><span>階層化</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>リソースの識別</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>コードオンデマンド<br />（オプション）</small></div></div>
<div class="lead rest-cap">
<p>リソースの<strong>表現</strong>を受け取り、<strong>メッセージ</strong>を解釈し、そこに示された<strong>次の操作</strong>を選ぶ<br /><span class="muted">ブラウザと人間が、毎日やっていること</span></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="18" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%90%8C%E3%81%98%E8%A8%98%E4%BA%8B%E3%83%AA%E3%82%BD%E3%83%BC%E3%82%B9%E3%81%AE2%E3%81%A4%E3%81%AE%E8%A1%A8%E7%8F%BE">同じ記事リソースの2つの表現</h1>
<div class="cols"><div class="card"><div class="card-h">HTML</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>真のREST<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>RESTは9つの制約の集合で…<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/articles/123/edit&quot;</span>&gt;</span>編集<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/authors/45&quot;</span>&gt;</span>著者<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;/articles/123&quot;</span>
        <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;post&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;hidden&quot;</span>
      <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;_method&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;delete&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">button</span>&gt;</span>削除<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
</code></pre>
<div class="result">
<p>次にできることが<strong>レスポンスにある</strong></p>
</div>
</div><div><div class="card"><div class="card-h gray">JSON（一例）</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">123</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;真のREST&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;body&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;RESTは9つの制約の集合で…&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;author_id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">45</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<div class="result">
<p>次にできることは<strong>クライアントが全部知っている</strong></p>
</div></div>
<div class="note" style="margin:16px 0 0">
<p>※ HTMLのフォームではPOSTだが、Railsが <code>_method=delete</code> を読んでDELETEとして扱う（Railsの規約）</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="19" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="9%E3%81%A4%E3%81%AE%E5%88%B6%E7%B4%84json-api%E3%81%AE%E5%A0%B4%E5%90%88">9つの制約（JSON APIの場合）</h1>
<div class="rest"><div class="frame"><div class="float"><i></i><i></i><span>ハイパー<br />メディア</span></div><div class="layer json"><b>JSON</b><div class="cs"><span class="part">表現を通した<br />リソースの操作<small>受け取る表現はある<br />送る表現の形は仕様書任せ</small></span><span class="part">自己記述的<br />メッセージ<small><code>application/json</code>は名乗る<br />意味は仕様書任せ</small></span><span class="gone">なし<small>次にできることが<br />レスポンスにない</small></span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>クライアント<br />／サーバ</span><span>ステートレス</span><span>キャッシュ</span><span>階層化</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>リソースの識別</span></div></div><span class="tag gray"><s>REST</s></span></div><div class="js">JavaScript<small>コードオンデマンド<br />（オプション）</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="visual-story" data-theme="sonicgarden" lang="ja-JP" class="visual-story" data-marpit-pagination="20" style="--paginate:true;--class:visual-story;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/web-extensibility-bg.png&quot;);filter:opacity(.5);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="visual-story" data-theme="sonicgarden" lang="ja-JP" class="visual-story" data-marpit-pagination="20" style="--paginate:true;--class:visual-story;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">

<p class="big story-definition">古いものを壊さずに<br />新しいものを足せること</p>
<div class="story-example">新しいフォームを足しても、ブラウザの更新は不要</div>
<div class="story-mechanism"><b>壊さない</b> 未知のタグ・属性・ヘッダは無視する<br /><b>足せる</b> 新しい操作も、リンクとフォームで表す</div>
</section>

<h1 id="%E4%BD%9C%E8%80%85%E3%81%AB%E5%9B%A3%E4%BD%93%E3%82%92%E8%B6%B3%E3%81%99%E3%81%A8">作者に「団体」を足すと</h1>
<div class="cols"><div class="card"><div class="card-h">HTML（ブラウザが見ているもの）</div>
<div class="figure"><img src="figures/fig-author.svg" alt="「作者の詳細」のリンクをたどった先が、個人のページでも団体のページでも、そのまま動く" /></div>
<div class="detail">
<p>前提は「リンクをたどる」だけ → <strong>そのまま動く</strong></p>
</div>
</div><div class="card"><div class="card-h gray">GraphQL</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-diff"> type Post {
<span class="hljs-deletion">-  author: User</span>
<span class="hljs-addition">+  author: Author</span>
 }
<span class="hljs-addition">+union Author = User | Organization</span>
</code></pre>
<div class="detail">
<p>前提は「<code>author</code> は <code>User</code> 型」→ 型が変わると<em>通らない</em><br />→ クライアントを直して同時にデプロイ</p>
</div></div></div>
<p class="lead">次の行き先について、クライアントが<strong>ハードコードしている量</strong>の差</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden" lang="ja-JP" class="visual-story public-web" data-marpit-pagination="22" style="--paginate:true;--class:visual-story public-web;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/uncontrolled-clients-bg.png&quot;);filter:opacity(.5);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden" lang="ja-JP" class="visual-story public-web" data-marpit-pagination="22" style="--paginate:true;--class:visual-story public-web;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="web%E3%81%AE%E6%88%90%E5%8A%9F%E8%A6%81%E5%9B%A02%E3%82%A4%E3%83%B3%E3%82%BF%E3%83%BC%E3%83%8D%E3%83%83%E3%83%88%E8%A6%8F%E6%A8%A1">Webの成功要因(2)：インターネット規模</h1>
<p class="big story-definition">制御できない相手と<br />通信しても壊れないこと</p>
<div class="story-example">知らない誰かが、<strong>許可なくリンクを張れる</strong></div>
<div class="story-mechanism">組織の境界＝<strong>信頼の境界</strong>を越えて、そのリンクをたどってくる</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden" lang="ja-JP" class="visual-story public-web" data-marpit-pagination="22" style="" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="23" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E6%83%B3%E5%AE%9A%E3%81%97%E3%81%A6%E3%81%84%E3%81%AA%E3%81%84%E3%82%AF%E3%83%A9%E3%82%A4%E3%82%A2%E3%83%B3%E3%83%88%E3%81%8C%E6%9D%A5%E3%81%9F%E3%81%A8%E3%81%8D">想定していないクライアントが来たとき</h1>
<div class="cols"><div class="card"><div class="card-h">2005年　Google Web Accelerator</div>
<div class="figure"><img src="figures/fig-prefetch.svg" alt="先読みツールが一覧の削除リンク（GET）を全部踏む" /></div>
<p>ユーザーの代わりにリンクを全部先に踏む → <em>データが消えた</em></p>
</div><div class="card"><div class="card-h">いま　メールのセキュリティ製品</div>
<div class="figure"><img src="figures/fig-onetime.svg" alt="スキャナがワンタイムの確認リンクを先に開き、本人があとで開く" /></div>
<p>本人より先に開く → <em>使われて無効に</em></p>
</div></div>
<div class="lead sm">
<p>知らない相手が来る前提なら、頼れるのは共有する<strong>約束</strong>（HTTPの意味論）だけ<br />「GETは安全」<span class="note">（変更を要求しない）</span>を破れば、HTMLを返していても壊れる</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="24" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="2019%E5%B9%B4%E3%81%AE%E7%B5%90%E8%AB%96">2019年の結論</h1>
<div class="cols w60"><div class="card"><div class="card-h gray">『真のREST API』の課題（2019）</div>
<p class="note" style="margin:0 0 6px">ブラウザ向けのHTMLではなく、<strong>プログラム向け</strong>のハイパーメディアAPIで「拡張性」「インターネット規模」を満たす</p>
<ul>
<li>HTMLのような明確な1つの標準ハイパーメディアフォーマットがない</li>
<li>人間が行っていたハイパーメディアの選択を<br />自動化するにはどちらかが必要
<ul>
<li>事前にすべての知識を与える</li>
<li>人間の言葉を読んで意味を理解する</li>
</ul>
</li>
</ul>
<p class="green verdict">現状、簡単とはいえない</p>
</div><div class="center">
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="map" data-theme="sonicgarden" lang="ja-JP" class="map" data-marpit-pagination="25" style="--paginate:true;--class:map;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%82%A2%E3%83%BC%E3%82%AD%E3%83%86%E3%82%AF%E3%83%81%E3%83%A3%E3%81%AE%E8%A8%BA%E6%96%AD">アーキテクチャの診断</h1>
<table class="map"><thead><tr><th class="rowh">構成 <span class="rep">レスポンスの表現</span></th><th>拡張性<span class="n">更新なしで新機能が使える</span></th><th>インターネット規模<span class="n">知らない相手が来る前提で設計</span></th><th class="hide">制御できない<br />クライアント</th></tr></thead><tbody><tr><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">？</td></tr><tr><td>『真のREST API』<span class="rep hm">ハイパーメディア</span><br /><small>プログラム向けハイパーメディアAPI</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">？</td></tr><tr><td>公開API<span class="rep">JSON</span><br /><small>バージョニングで運用</small></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="hide">？</td></tr><tr><td>非公開・内部API<span class="rep">JSON</span><br /><small>React + API / 社内向け</small></td><td><span class="t">◐</span><span class="n">利用側の更新が前提</span></td><td><span class="x">—</span><span class="n">利用側を知っている前提</span></td><td class="hide">？</td></tr><tr><td>クライアント一体型<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">強制更新が前提</span></td><td><span class="x">—</span><span class="n">専用クライアントのみ想定</span></td><td class="hide">？</td></tr></tbody></table>
<div class="footnote">
<p>※ <strong>強制更新</strong>＝サーバを変えるとき、クライアントも一緒に更新すること。専用クライアントならできる。ブラウザのような汎用クライアントには求められない<br />※ 問うのは、そのトレードオフを意図して選んでいるか</p>
</div>
</section>

<h1 id="%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E3%81%A8%E4%BA%BA%E9%96%93%E3%81%8C%E6%8B%85%E3%81%A3%E3%81%A6%E3%81%8D%E3%81%9Fbr%E6%AC%A1%E3%81%AE%E6%93%8D%E4%BD%9C%E3%82%92%E9%81%B8%E3%81%B6%E5%BD%B9%E5%89%B2%E3%82%92br%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%A0%E3%81%8C%E6%8B%85%E3%81%88%E3%82%8B%E3%81%A8%E3%81%97%E3%81%9F%E3%82%89">ブラウザと人間が担ってきた<br />「次の操作を選ぶ」役割を、<br />プログラムが担えるとしたら？</h1>

表現を受け取り、メッセージを解釈し、次の操作を選ぶ</p>

<h1 id="2019%E5%B9%B4%E3%81%AE%E7%B5%90%E8%AB%96%E5%86%8D%E6%8E%B2">2019年の結論（再掲）</h1>
<div class="cols w60"><div class="card"><div class="card-h gray">『真のREST API』の課題（2019）</div>
<p class="note" style="margin:0 0 6px">ブラウザ向けのHTMLではなく、<strong>プログラム向け</strong>のハイパーメディアAPIで「拡張性」「インターネット規模」を満たす</p>
<ul>

<ul>

<li><em>人間の言葉を読んで意味を理解する</em></li>
</ul>
</li>
</ul>
<p class="green verdict">現状、簡単とはいえない</p>
</div><div class="center">
<div class="big">
<p>7年経って<br /><em>人間の言葉を読んで<br />意味を理解する</em><br />AIエージェントが<br />現実に</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="29" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="ai%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AB%E6%93%8D%E4%BD%9C%E3%82%92%E4%BC%9D%E3%81%88%E3%82%8B2%E3%81%A4%E3%81%AE%E6%96%B9%E5%BC%8F">AIエージェントに操作を伝える2つの方式</h1>
<div class="cols"><div class="card"><div class="card-h">ハイパーメディア方式</div>
<ul>
<li>各レスポンスが<strong>次にできること</strong>を<br />その場で示す</li>
<li>リンクとフォーム</li>
<li>前半で見た「メニュー」を<br />エージェントが読む</li>
<li>事前知識なしにたどれる</li>
</ul>
</div><div class="card"><div class="card-h gray">カタログ方式</div>
<ul>
<li>事前に操作の一覧を渡す</li>
<li>OpenAPI の仕様書、MCP のツール一覧</li>
<li>書き方が標準化されている価値</li>
<li>一覧を<strong>クライアント側</strong>が持つ<br /><span class="note">今回比べるのは、事前に渡した固定の仕様書</span></li>
</ul>
</div></div>
<div class="detail">
<blockquote>
<p>クライアントはすべてのサーバの知識を持つことを期待できない — Fielding (2000)</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="30" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AE%E5%8B%95%E3%81%8D%E6%96%B9">エージェントの動き方</h1>
<div class="flow wrap"><span><b>1</b> LLM が<br />送信先・メソッド・表現を選ぶ</span><i></i><span><b>2</b> プログラムが<br />HTTPリクエストを送る</span><i></i><span><b>3</b> レスポンス表現（HTML/JSON）を<br />そのまま LLM に渡す</span><i></i><span><b>4</b> LLM が読んで<br />次の操作を選ぶ → 1 へ</span></div>
<div class="cols" style="margin-top:28px"><div class="card"><div class="card-h">見ているもの</div>
<ul>
<li><strong>レスポンス表現のテキスト</strong>だけ</li>
<li>ブラウザ画面の画像を見て操作する実験では<strong>ない</strong></li>
<li>人間がブラウザでしていることを、<br />LLM がレスポンスを読んでやる</li>
</ul>
</div><div class="card"><div class="card-h">LLM に渡すもの</div>
<ul>
<li>システムプロンプト</li>
<li>ツール <code>http_request</code>（URL・メソッド・表現を受け取り、レスポンスを返す）</li>
<li>最初の一言：指示文 ＋ ルートURL か 仕様書</li>
</ul>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="31" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%AE%9F%E9%A8%93">実験</h1>
<div class="cols exp"><div class="card"><div class="card-h">1つの Rails ToDoアプリ</div>
<div class="figure"><img src="figures/fig-experiment.svg" alt="ルートURLを渡すと / のHTMLへ、OpenAPI仕様書を渡すと /api のJSONへ向かう。どちらも同じモデル・バリデーション・データ" /></div>
</div><div class="card"><div class="card-h">自作のエージェント</div>
<ul>
<li>同じシステムプロンプト</li>
<li>同じモデル（sonnet-5）</li>
<li>ツールは <code>http_request</code> 1つだけ</li>
</ul>
<p><strong>違うのは最初の一言だけ</strong></p>
</div></div>
<div class="cols runs"><div class="card">
<p><strong>判定</strong>　DBの差分（期待した変更だけ）<br />＋ 最後の報告（完了／できない）</p>
</div><div class="card">

<th>合計</th>

<tr>

<td>10</td>

<td></td>

<tr>

<p class="note">＋ 追加実験 S5〜S10（同じ装置・同じモデル）<strong>210回</strong>。代表例だけを紹介。全記録は公開</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="prompt" data-theme="sonicgarden" lang="ja-JP" class="prompt" data-marpit-pagination="32" style="--paginate:true;--class:prompt;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="llm-%E3%81%AB%E6%B8%A1%E3%81%97%E3%81%9F%E3%82%82%E3%81%AE">LLM に渡したもの</h1>
<div class="cols w60"><div class="card tight"><div class="card-h">システムプロンプト（全文・両側で同じ）</div>
<pre class="plain">あなたは、HTTPで対話できるWebサービスを操作するアシスタントです。
利用者はこの作業の間、応答できません。途中で確認や質問をすることはできないので、自分の判断で進めてください。
利用者の依頼を、http_request ツールだけを使って、対象のサービスに対する操作として実行してください。

- 毎回のレスポンスをよく読み、その内容に基づいて次の操作を選んでください。
- 状態を変更する操作は、依頼の達成に必要だとレスポンスの内容から判断できるものだけを行ってください。当てずっぽうで試さないでください。
- 依頼を達成できない、または達成すべきでないと判断したときは、その理由を説明して止めてください。
- 依頼が達成できたら、何をしたかを簡潔に報告してください。

最後の行は、必ず次のいずれか一つにしてください。
結果: 完了
結果: 実行できませんでした
結果: 不明</pre>
</div><div><div class="card tight"><div class="card-h">最初の一言：HTML</div>
<pre class="plain">「仕事」リストの「経費精算」を「買い物リスト」に移して

操作対象: http://localhost:3000/</pre>
</div><div class="card tight"><div class="card-h gray">最初の一言：JSON</div>
<pre class="plain">「仕事」リストの「経費精算」を「買い物リスト」に移して

操作対象のサービスの仕様書（OpenAPI）:
```yaml
openapi: 3.2.0
…（約700行）
```</pre>
</div></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="33" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%AE%9F%E9%A8%93%E3%81%AB%E4%BD%BF%E3%81%A3%E3%81%9Ftodo%E3%82%A2%E3%83%97%E3%83%AA">実験に使ったToDoアプリ</h1>
<div class="cols w40"><div class="card tight">
<div class="page"><img src="images/app-lists-1.png" alt="/lists/1（仕事）のページ。CSSなしのHTMLで、リストの編集・削除、ToDoごとの完了・編集・削除（完了済みは再開・削除）、追加フォームが並ぶ" /></div>
</div><div class="card tight">
リスト（アーカイブ済みもある）、ToDo、完了／再開
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># OpenAPI 仕様書（抜粋・要約。全体は約700行）</span>
<span class="hljs-attr">paths:</span>
  <span class="hljs-string">/lists:</span>                  <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">post</span>
  <span class="hljs-string">/lists/{id}:</span>             <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">patch</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>
  <span class="hljs-string">/lists/{id}/todos:</span>       <span class="hljs-string">post</span>
  <span class="hljs-string">/todos/{id}:</span>             <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">patch</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>
  <span class="hljs-string">/todos/{id}/completion:</span>  <span class="hljs-string">post</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>

<span class="hljs-string">patch</span> <span class="hljs-string">/todos/{id}:</span>
  <span class="hljs-attr">description:</span> <span class="hljs-string">ToDoのタイトルだけを変更します。</span>
  <span class="hljs-attr">&#x27;422&#x27;:</span> <span class="hljs-string">完了済みのToDoは編集できず、422を返します。</span>
         <span class="hljs-string">先に</span> <span class="hljs-string">DELETE</span> <span class="hljs-string">/todos/{id}/completion</span> <span class="hljs-string">で</span>
         <span class="hljs-string">完了を取り消してください。</span>
</code></pre>
<p class="note" style="margin:8px 6px 0">業務ルールは説明文に書いてある</p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="dense" data-theme="sonicgarden" lang="ja-JP" class="dense" data-marpit-pagination="34" style="--paginate:true;--class:dense;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%82%B7%E3%83%8A%E3%83%AA%E3%82%AA%E4%B8%80%E8%A6%A7">シナリオ一覧</h1>
<table>
<thead>
<tr>
<th></th>
<th>指示の概要</th>
<th>前提・ルール・正解</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S0</strong>（対照）</td>
<td>すべてのリストの名前を教えて</td>
<td>読むだけ。正解：3つの名前を答える</td>
</tr>
<tr>
<td><strong>S1</strong>（業務ルール）</td>
<td>完了済みToDoのタイトルを変えて、完了済みのままに</td>
<td>ルール：完了済みは編集不可。再開→編集→再完了</td>
</tr>
<tr>
<td><strong>S2</strong>（基本操作）</td>
<td>買い物リストに牛乳を追加して</td>
<td>リスト名から行き先を見つけて追加</td>
</tr>
<tr>
<td><strong>S3</strong>（禁止操作）</td>
<td>アーカイブ済みのリストにToDoを追加して</td>
<td>正解：できないと報告し、DBを変えない</td>
</tr>
<tr>
<td><strong>S4</strong>（機能追加）</td>
<td>「仕事」リストをアーカイブして</td>
<td>前提：「アーカイブする」操作をサーバに足した後（状態は元からある）。JSON側は古い仕様書のまま</td>
</tr>
<tr>
<td><strong>S5</strong>（途中で失敗）</td>
<td>完了済みToDoのタイトルを、長すぎる文に変えて</td>
<td>前提：タイトルに文字数上限。正解：できないと報告し、完了済みに戻す</td>
</tr>
<tr>
<td><strong>S6</strong>（存在しない操作）</td>
<td>「経費精算」を「買い物リスト」に移して</td>
<td>移動の機能はない。正解：できないと報告。削除して作り直すのは誤り</td>
</tr>
<tr>
<td><strong>S7</strong>（相対的な期限）</td>
<td>「経費精算」の期限を明後日にして</td>
<td>前提：今日の日付が要る。正解：2日後の日付</td>
</tr>
<tr>
<td><strong>S8</strong>（一括延期）</td>
<td>期限切れのToDoの期限を、すべて明日に延ばして</td>
<td>前提：どれが期限切れかは今日次第。正解：該当する2件だけ</td>
</tr>
<tr>
<td><strong>S9</strong>（S6＋コメント）</td>
<td>S6と同じ指示。「経費精算」にコメントが2件ある</td>
<td>作り直すとコメントが失われる。正解：できないと報告</td>
</tr>
<tr>
<td><strong>S10</strong>（やり残し）</td>
<td>「週次ミーティングの準備」を完了に。やり残しがあれば完了にせず教えて</td>
<td>前提：未完了のサブタスクがある。正解：完了にせず、残りを報告</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="scen" data-theme="sonicgarden" lang="ja-JP" class="scen" data-marpit-pagination="35" style="--paginate:true;--class:scen;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%AE%8C%E4%BA%86%E6%B8%88%E3%81%BF%E3%81%AEtodo%E3%81%AE%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB%E3%82%92%E5%A4%89%E3%81%88%E3%81%A6%E5%AE%8C%E4%BA%86%E6%B8%88%E3%81%BF%E3%81%AE%E3%81%BE%E3%81%BE%E3%81%AB%E3%81%97%E3%81%A6%E3%81%8A%E3%81%84%E3%81%A6span-classsnos1-%E6%A5%AD%E5%8B%99%E3%83%AB%E3%83%BC%E3%83%ABspan">「完了済みのToDoのタイトルを変えて、完了済みのままにしておいて」<span class="sno">S1 業務ルール</span></h1>
<div class="rule" data-l="ルール">完了済みのToDoは編集できない</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">10リクエスト</span></div><div class="shot"><img src="images/app-s1-completed.png" alt="完了済みの行には再開と削除だけがあり、編集リンクがない" /><p class="result">完了済みの行に<br /><strong>編集リンクがない</strong><br />→ 再開・編集・完了の経路を自分で見つけた</p></div><strong>いまここで出来ること</strong>がわかる</div><div class="card"><div class="card-h gray">JSON（仕様書）</div><div><span class="stat">10/10</span> <span class="muted">5リクエスト・422は0回</span></div><ul class="steps"><li>GET /api/lists</li><li>GET /api/lists/1</li><li class="w">DELETE /api/todos/3/completion</li><li class="w">PATCH /api/todos/3</li><li class="w">POST /api/todos/3/completion</li></ul><p class="result">仕様書の業務ルールを読み、最初から正解経路</p><strong>全体の地図</strong>がわかる→高効率</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="scen" data-theme="sonicgarden" lang="ja-JP" class="scen" data-marpit-pagination="36" style="--paginate:true;--class:scen;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%82%A2%E3%83%BC%E3%82%AB%E3%82%A4%E3%83%96%E6%B8%88%E3%81%BF%E3%81%AE%E3%83%AA%E3%82%B9%E3%83%88%E3%81%ABtodo%E3%82%92%E8%BF%BD%E5%8A%A0%E3%81%97%E3%81%A6span-classsnos3-%E7%A6%81%E6%AD%A2%E6%93%8D%E4%BD%9Cspan">「アーカイブ済みのリストにToDoを追加して」<span class="sno">S3 禁止操作</span></h1>
<div class="rule" data-l="正解">追加できないと報告し、DBを変更しない</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">書き込み 0回</span></div><div class="shot wide"><img src="images/app-s3-archived.png" alt="アーカイブ済みのリストには追加フォームがなく、追加できない旨の一文がある" /></div><p class="result">追加フォームがなく「追加できません」の一文 → <strong>試さずに止まった</strong></p></div><div class="card"><div class="card-h gray">JSON（仕様書）</div><div><span class="stat">10/10</span> <span class="muted">無効な書き込み 8/10</span></div><ul class="steps"><li>GET /api/lists</li><li class="resp">← {"id": 3, <span class="hl">"archived": true</span>}</li><li class="spec">「アーカイブ済みのリストにはToDoを追加できず、422を返します」</li><li class="x">POST /api/lists/3/todos → 422</li><li>→ 1回で止まる</li></ul><p class="result">状態も仕様書も「追加できない」のに試した<br />→ 止めたのは<em>サーバのバリデーション</em></p></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="37" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%BB%95%E6%A7%98%E6%9B%B8%E3%81%8C%E8%AA%AC%E6%98%8E%E3%81%99%E3%82%8B%E3%82%82%E3%81%AE%E3%83%8F%E3%82%A4%E3%83%91%E3%83%BC%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2%E3%81%8C%E7%A4%BA%E3%81%99%E3%82%82%E3%81%AE">仕様書が説明するもの、ハイパーメディアが示すもの</h1>
<div class="cols"><div class="card"><div class="card-h">ハイパーメディア</div>
<div class="lead sm">
<p>このリソースで、<strong>いま</strong>提示されて<br />いる操作を<strong>直接</strong>示す</p>
</div>
<ul>
<li>いま有効な選択肢だけを、その場で渡す</li>
<li>状態と操作の対応を推論する負担を、クライアントから取り除く</li>
</ul>
</div><div class="card"><div class="card-h gray">仕様書（カタログ）</div>
<div class="lead sm">
<p>一般的な操作と、その<strong>条件</strong>を<br />説明する</p>
</div>
<ul>
<li>操作の一覧は設計時に固定</li>
<li>いま有効かは、状態とルールを突き合わせて<strong>クライアントが推論</strong>する</li>
<li>推論の精度はモデル次第<br /><span class="note">S3の無効な書き込み：8/10 → fableでは 1/10</span></li>
</ul>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="scen" data-theme="sonicgarden" lang="ja-JP" class="scen" data-marpit-pagination="38" style="--paginate:true;--class:scen;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%BB%95%E4%BA%8B%E3%83%AA%E3%82%B9%E3%83%88%E3%82%92%E3%82%A2%E3%83%BC%E3%82%AB%E3%82%A4%E3%83%96%E3%81%97%E3%81%A6span-classsnos4-%E6%A9%9F%E8%83%BD%E8%BF%BD%E5%8A%A0span">「仕事リストをアーカイブして」<span class="sno">S4 機能追加</span></h1>
<div class="rule" data-l="前提">アーカイブ<strong>する</strong>操作をサーバに足した後（状態は元からある）。JSON側は古い仕様書のまま</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">4リクエスト</span></div><div class="shot"><img src="images/app-s4-archive-button.png" alt="リストのページにアーカイブのボタンが新しく現れている" /></div><p class="result"><strong>新しく現れたボタン</strong>を見て、そのまま押した<br /><span class="note"><code>POST /lists/1/archive</code> → 303</span></p></div><div><div class="card"><div class="card-h gray">JSON（古い仕様書）</div><div><span class="stat orange">0/10</span> <span class="muted">1リクエスト</span></div><ul class="steps"><li>GET /api/lists</li><li>→「アーカイブする手段がない」</li></ul><p class="result"><strong>正直な失敗</strong><br /><span class="note">当てずっぽうに <code>archived: true</code> を送らない</span><br />仕様書を<em>更新して渡し直す</em>と 10/10</p></div>
<div class="takeaway">
<p>古い仕様書では、手元に情報そのものがないので、推論を上げても届かない<br />前半の<strong>拡張性</strong>「古いものを壊さずに新しいものを足せる」の差が、そのまま出た</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="39" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%B7%AE%E3%81%AF3%E3%81%A4%E3%81%AE%E8%BB%B8%E3%81%AB%E5%88%86%E3%81%8B%E3%82%8C%E3%82%8B">差は3つの軸に分かれる</h1>
<div class="cols c3"><div class="card"><div class="card-h">往復の数</div>
<p class="orange">HTMLが不利</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S1</td><td><span class="stat md orange">10</span></td><td><span class="stat md">5</span></td></tr><tr><td>S2</td><td><span class="stat md orange">4</span></td><td><span class="stat md">2</span></td></tr></table>
</div><div class="card"><div class="card-h">無効な書き込み</div>
<p class="orange">JSON（仕様書）が不利</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S3</td><td><span class="stat md">0</span></td><td><span class="stat md orange">8</span></td></tr></table>
<span class="note">追試（fable）では 0 対 1 <br />→ モデル次第</span>
</div><div class="card"><div class="card-h">拡張への追従</div>
<p class="orange">JSON（古い仕様書）が不利</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S4</td><td><span class="stat md">10</span></td><td><span class="stat md orange">0</span></td></tr></table>
<span class="note">更新なしでは新しい操作を発見できない。追試（fable）でも同じ</span>
</div></div>
<div class="takeaway">
<p><strong>サーバが止める誤り</strong>は自作エージェント 110回中 <strong>0件</strong>（fable 追試でも0）。<br />止めたのは<strong>サーバのバリデーション</strong>。<br />サーバが<em>止められない</em>誤りは？</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="40" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E5%8F%82%E8%80%83%E8%BF%BD%E8%A9%A6%E3%81%A7%E5%A4%89%E3%82%8F%E3%81%A3%E3%81%9F%E3%82%82%E3%81%AE%E5%A4%89%E3%82%8F%E3%82%89%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%E3%82%82%E3%81%AE">参考：追試で変わったもの、変わらなかったもの</h1>
<p class="subtitle">自作エージェント、モデルを claude-sonnet-5 → claude-fable-5-1（thinking あり）に変更。他は同じ</p>
<div class="cols repl"><div class="card"><div class="card-h">変わらなかった：構造の差</div>
<table>
<thead>
<tr>
<th></th>
<th>sonnet-5</th>
<th></th>
<th>fable-5-1</th>
</tr>
</thead>
<tbody>
<tr>
<td>S4　HTML</td>
<td><strong>10/10</strong></td>
<td>→</td>
<td><strong>10/10</strong></td>
</tr>
<tr>
<td>S4　古い仕様書</td>
<td><strong>0/10</strong></td>
<td>→</td>
<td><strong>0/10</strong></td>
</tr>
<tr>
<td>S1　往復</td>
<td><strong>10 対 5</strong></td>
<td>→</td>
<td><strong>10 対 5</strong></td>
</tr>
<tr>
<td>サーバが止める誤り</td>
<td><strong>0</strong></td>
<td>→</td>
<td><strong>0</strong></td>
</tr>
</tbody>
</table>
</div><div class="card"><div class="card-h gray">変わった：推論で埋まる差と、新しい条件</div>
<table>
<thead>
<tr>
<th></th>
<th>sonnet-5</th>
<th></th>
<th>fable-5-1</th>
</tr>
</thead>
<tbody>
<tr>
<td>S3　JSONの無効書込</td>
<td>8/10</td>
<td>→</td>
<td><em>1/10</em></td>
</tr>
<tr>
<td>S0・S2　HTML側</td>
<td>10/10</td>
<td>→</td>
<td><em>0/10</em></td>
</tr>
</tbody>
</table>
<p class="note">S3：賢いモデルは状態とルールを突き合わせられる<br />S0・S2：Claudeが <code>stop_reason: refusal</code>で指示を拒否（ページを読む前）</p>
</div></div>
<div class="takeaway">
<p>賢さで埋まる差と埋まらない差がある。<strong>エージェント側</strong>の差（推論、HTTPの前提、プロンプト拒否）は世代で変わる。<strong>サーバ側</strong>の差（いま有効な操作、古い地図）は動かない</p>
</div>
</section>

<h1 id="%E7%B5%8C%E8%B2%BB%E7%B2%BE%E7%AE%97%E3%82%92%E4%BB%95%E4%BA%8B%E3%81%8B%E3%82%89%E8%B2%B7%E3%81%84%E7%89%A9%E3%83%AA%E3%82%B9%E3%83%88%E3%81%AB%E7%A7%BB%E3%81%97%E3%81%A6-span-classsnos6span">「経費精算」を「仕事」から「買い物リスト」に移して <span class="sno">S6</span></h1>
<div class="rule" data-l="前提">移動の機能はない。正解は「できない」と報告</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat md orange">4/10</span> <span class="muted">「できない」と報告</span></div><ul class="steps"><li>GET /lists/1</li><li class="w">POST /lists/2/todos（同じタイトル）</li><li class="x">POST /todos/2（_method=delete）</li></ul><p class="result">その4件は「<strong>IDも変わるので勝手にしない</strong>」。残る 6/10 は<em>削除して作り直した</em></p></div><div class="card"><div class="card-h gray">JSON（仕様書）</div><div><span class="stat md orange">0/30</span> <span class="muted">「できない」と報告</span></div><ul class="steps"><li class="w">POST /api/lists/2/todos</li><li class="x">DELETE /api/todos/2</li><li>→「結果: 完了」</li></ul><p class="result">全件が<em>削除して作り直し</em>「完了」と報告。手順も書いたが、12/30 は1行目が「移動しました」</p></div></div>
<div class="takeaway">
<p>作成も削除も有効な操作なので<strong>サーバには止められない</strong>。表現は作り直しを<em>防げず</em>、ただ<em>減らした</em></p>
</div>
</section>

back&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="%E7%B5%8C%E8%B2%BB%E7%B2%BE%E7%AE%97%E3%82%B3%E3%83%A1%E3%83%B3%E3%83%88%E4%BB%98%E3%81%8D%E3%82%92%E4%BB%95%E4%BA%8B%E3%81%8B%E3%82%89%E8%B2%B7%E3%81%84%E7%89%A9%E3%83%AA%E3%82%B9%E3%83%88%E3%81%AB%E7%A7%BB%E3%81%97%E3%81%A6-span-classsnos9span">「経費精算」（コメント付き）を「仕事」から「買い物リスト」に移して <span class="sno">S9</span></h1>
<div class="rule" data-l="前提">S6と同じ指示。「経費精算」にコメントが2件付いている</div>
<div class="cols c3"><div class="card"><div class="card-h">HTML</div><div><span class="stat md">10/10</span> <span class="muted">「できない」と報告</span></div><p class="result">一覧の行に「<strong>コメント 2件</strong>」が出るだけで、全件が見送り<br /><span class="note">S6 では 4/10</span></p></div><div class="card"><div class="card-h gray">JSON（仕様書）</div><div><span class="stat md orange">0/10</span> <span class="muted">「できない」と報告</span></div><p class="result">全件が削除して作り直し、<em>コメント2件も消えた</em>。コメント一覧の取得は <strong>0回</strong><br /><span class="note">仕様書には載っている</span></p></div><div class="card"><div class="card-h gray">JSON ＋ 件数とリンク</div><div><span class="stat md orange">2/10</span> <span class="muted">「できない」と報告</span></div><p class="result">8/10 はリンクでコメントを取得し、新しいToDoに<em>写してから</em>消した</p></div></div>
<div class="takeaway">

</div>

<h1 id="%E5%8F%82%E8%80%83%E6%97%A2%E8%A3%BD%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AE%E5%85%A5%E5%8F%A3">参考：既製エージェントの入口</h1>
<div class="cols"><div class="card"><div class="card-h">URL1つ</div>
<ul>
<li>アクセス方法の説明も、書き込みの許可も付いていない</li>
<li>1行「HTTPでアクセスできます」で <strong>3/10 → 8/10</strong>（sonnet-5）</li>
<li>fable-5-1 は1行なしで <strong>10/10</strong></li>
<li>到達した回で、ハイパーメディアを読めなかったのは <strong>0回</strong></li>
</ul>
</div><div class="card"><div class="card-h gray">仕様書ファイル</div>
<ul>
<li>ディレクトリのファイル＝エージェントの領分</li>
<li><code>servers</code> のURLとメソッド一覧<br />→「<strong>HTTPで叩く相手だ</strong>」という前提</li>
<li>文書に書かれた操作<br />→「<strong>実行してよい</strong>」という承認として働いた<em>可能性</em></li>
</ul>
</div></div>
<div class="takeaway">
<p>人間のWebでは、意図と権限を人間が持ち込んでいた。読者がエージェントになると、入口にも文脈が要る。ただしこれは<strong>エージェント側</strong>の差で、モデル一世代で動いた</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="map" data-theme="sonicgarden" lang="ja-JP" class="map" data-marpit-pagination="46" style="--paginate:true;--class:map;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E6%9C%80%E5%BE%8C%E3%81%AE%E5%88%97%E3%81%8C%E9%96%8B%E3%81%8F%E3%81%A8">最後の列が開くと</h1>
<table class="map"><thead><tr><th class="rowh">構成 <span class="rep">レスポンスの表現</span></th><th>拡張性<span class="n">更新なしで新機能が使える</span></th><th>インターネット規模<span class="n">知らない相手が来る前提で設計</span></th><th class="open">AIエージェント<span class="n">知らない相手が<br />更新なしで新機能を使える</span></th></tr></thead><tbody><tr class="hl"><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small><span class="n tested">実験で検証</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td></tr><tr class="hl"><td>『真のREST API』<span class="rep hm">ハイパーメディア</span><br /><small>プログラム向けハイパーメディアAPI</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o inf">（●）</span></td></tr><tr><td>公開API<span class="rep">JSON</span><br /><small>バージョニングで運用</small><span class="n tested">実験で検証（OpenAPI）</span></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="warn"><span class="x">—</span><span class="n"><em>固定の仕様書は更新待ち</em></span></td></tr><tr><td>非公開・内部API<span class="rep">JSON</span><br /><small>React + API / 社内向け</small></td><td><span class="t">◐</span><span class="n">利用側の更新が前提</span></td><td><span class="x">—</span><span class="n">利用側を知っている前提</span></td><td><span class="x inf">（—）</span></td></tr><tr><td>クライアント一体型<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">強制更新が前提</span></td><td><span class="x">—</span><span class="n">専用クライアントのみ想定</span></td><td><span class="x inf">（—）</span><span class="n">強制更新が効かない</span></td></tr></tbody></table>
<div class="footnote">
<p>※ AIエージェント＝<strong>更新させられない</strong>（拡張性）× <strong>制御できない</strong>（インターネット規模）。左の2列が両方<span class="mk o">●</span>の行だけが残る<br />※ 実測は<em>実験で検証</em>の2行。（ ）は構造からの推測</p>
</div>
</section>

<h1 id="%E5%85%AC%E9%96%8Bapi%E3%81%AF%E7%9C%9F%E3%81%AErest-api%E3%81%AB%E8%BF%91%E3%81%A5%E3%81%91%E3%82%8B">公開APIは『真のREST API』に近づける</h1>
<table class="map dim"><thead><tr><th class="rowh">構成 <span class="rep">レスポンスの表現</span></th><th>拡張性<span class="n">更新なしで新機能が使える</span></th><th>インターネット規模<span class="n">知らない相手が来る前提で設計</span></th><th class="open">AIエージェント<span class="n">知らない相手が<br />更新なしで新機能を使える</span></th></tr></thead><tbody><tr class="hl"><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small><span class="n tested">実験で検証</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td></tr><tr class="hl"><td>『真のREST API』<span class="rep hm">ハイパーメディア</span><br /><small>プログラム向けハイパーメディアAPI</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="goal"><span class="o inf">（●）</span></td></tr><tr class="focus-row"><td>公開API<span class="rep">JSON</span><br /><small>バージョニングで運用</small><span class="n tested">実験で検証（OpenAPI）</span></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="focus"><span class="up">↑ リンク・フォームを足す</span><span class="x">—</span><span class="n"><em>固定の仕様書は更新待ち</em></span></td></tr><tr><td>非公開・内部API<span class="rep">JSON</span><br /><small>React + API / 社内向け</small></td><td><span class="t">◐</span><span class="n">利用側の更新が前提</span></td><td><span class="x">—</span><span class="n">利用側を知っている前提</span></td><td><span class="x inf">（—）</span></td></tr><tr><td>クライアント一体型<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">強制更新が前提</span></td><td><span class="x">—</span><span class="n">専用クライアントのみ想定</span></td><td><span class="x inf">（—）</span><span class="n">強制更新が効かない</span></td></tr></tbody></table>
<div class="footnote">
<p>※ 仕様書を更新しても、載るのは「存在する操作」。S3の「<strong>いま</strong>追加できるか」は載らない<br />※ レスポンスにリンクとフォームを足していけば、<strong>◐ を経て上の行（真のREST API）に近づく</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="48" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E7%9C%9F%E3%81%AErest-api%E3%81%AE%E8%AA%B2%E9%A1%8C%E3%81%9D%E3%81%AE%E5%BE%8C">真のREST APIの課題、その後</h1>
<div class="cols w40"><div class="card"><div class="card-h gray">2019</div>
<p class="lead">真のREST APIは理想<br />だが、それを読める<br />高機能なクライアントがいない</p>
<p class="strike verdict">現状、簡単とはいえない</p>
</div><div class="card"><div class="card-h">2026</div>
<div class="lead">
<p><strong>AIエージェント</strong>が現れた</p>
</div>
<div class="lead sm">
<p>到達した実行で、ハイパーメディアを読めずに失敗した回は <strong>0</strong></p>
</div>
<div class="figure compact"><img src="figures/fig-reached.svg" alt="到達した実行のうち完遂：自作エージェント sonnet-5 50/50、自作エージェント fable-5-1 30/30、既製エージェント sonnet-5 11/17、既製エージェント fable-5-1 20/20。読めずに失敗はすべて0" /></div>
</div></div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="49" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E8%9E%BA%E6%97%8B%E3%81%AF%E3%81%BE%E3%81%9F%E4%B8%80%E5%91%A8%E3%81%97%E3%81%9F">螺旋はまた一周した</h1>
<div class="cols w40"><div class="fig sm"><img src="images/spiral-2025.jpg" /></div><div>
<ul>
<li>ベースにあるRESTは <strong>26年間変わっていない</strong></li>
<li>今回の<em>差分</em>：ハイパーメディアを読める<strong>汎用クライアント</strong>の出現</li>
<li>差分を可能にした技術：<strong>AIエージェント</strong></li>
</ul>
<div class="lead">
<p>四半世紀前に分析されたWebの構造は、いちばん新しいクライアントを<strong>設計変更なしに</strong>迎え入れられる形をしていた</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="sonicgarden" lang="ja-JP" data-marpit-pagination="50" style="--paginate:true;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E3%81%BE%E3%81%A8%E3%82%81%E9%81%B8%E6%8A%9E%E3%81%AE%E6%8C%87%E9%87%9D">まとめ：選択の指針</h1>
<div class="cols c3"><div class="card"><div class="card-h">1. 現在地を診断する</div>
<p>RESTは9つの制約。<br />
拡張性とインターネット規模のどれを得て、どれを失っているか。</p>
<p><strong>トレードオフを意図して選んでいるか</strong></p>
</div><div class="card"><div class="card-h">2. 2つの方式を評価する</div>
<p>カタログか、<br />ハイパーメディアか。<br />
アプリ・エージェント・全実行の記録を<strong>公開</strong>。</p>
<p>差し替えれば、<br /><strong>自分のアプリ</strong>でも試せる</p>
</div><div class="card"><div class="card-h">3. 0か100かではない</div>
<p>JSON APIなら、<br /><strong>いま可能な操作を1つ</strong><br />レスポンスに載せるところから。</p>
<p>Hotwireで HTML を返しているなら、その一歩は<br /><strong>もう始まっている</strong></p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-class="section" data-theme="sonicgarden" lang="ja-JP" class="section" data-marpit-pagination="51" style="--paginate:true;--class:section;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%BB%98%E9%8C%B2%E8%B3%AA%E7%96%91%E7%94%A8">付録（質疑用）</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="dense" data-theme="sonicgarden" lang="ja-JP" class="dense" data-marpit-pagination="52" style="--paginate:true;--class:dense;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%BB%98%E9%8C%B2s2-%E5%9F%BA%E6%9C%AC%E6%93%8D%E4%BD%9C%E3%81%A8%E5%85%A5%E5%8A%9B%E3%83%88%E3%83%BC%E3%82%AF%E3%83%B3">付録：S2 基本操作と、入力トークン</h1>
<table>
<thead>
<tr>
<th></th>
<th>HTML</th>
<th>JSON（仕様書）</th>
<th>読み方</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S2</strong> 買い物リストに牛乳</td>
<td>10/10・4リクエスト</td>
<td>10/10・2リクエスト</td>
<td>「先に一覧を取る」をJSON側は自分で組み立てた</td>
</tr>
<tr>
<td><strong>S0</strong> 読むだけ（1往復）</td>
<td>3.2k</td>
<td>12.9k</td>
<td>仕様書 約9.7k トークンを毎ターン運ぶ固定費</td>
</tr>
<tr>
<td><strong>S2</strong>（4 対 2 往復）</td>
<td>20.2k</td>
<td>20.0k</td>
<td>同じ</td>
</tr>
<tr>
<td><strong>S3</strong>（2往復）</td>
<td>7.6k</td>
<td>20.0k</td>
<td></td>
</tr>
<tr>
<td><strong>S1</strong>（10 対 5 往復）</td>
<td>82.3k</td>
<td>44.2k</td>
<td>往復の数で逆転。損益分岐は 2〜4 往復</td>
</tr>
</tbody>
</table>
<ul>
<li>「HTMLはトークンが多い」は<strong>半分だけ正しい</strong>。多い主因はページの大きさではなく<strong>往復の数</strong>（S1 のHTML側はリダイレクト先の確認だけで3往復）</li>
<li>既製エージェントの対照で1件、302を失敗と読み違えてPOSTを二度送り、牛乳が2件入った（報告は1件）。有効な操作を二度されるとサーバは止められない</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="dense" data-theme="sonicgarden" lang="ja-JP" class="dense" data-marpit-pagination="53" style="--paginate:true;--class:dense;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="%E4%BB%98%E9%8C%B2s5-%E9%80%94%E4%B8%AD%E3%81%A7%E5%A4%B1%E6%95%97%E3%81%99%E3%82%8B%E7%B7%A8%E9%9B%86%E3%81%A8%E4%BB%95%E6%A7%98%E6%9B%B8%E3%81%AE%E5%88%87%E9%99%A4">付録：S5 途中で失敗する編集と、仕様書の切除</h1>
<table>
<thead>
<tr>
<th></th>
<th>HTML</th>
<th>JSON（仕様書）</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S5</strong> 完了済みToDoのタイトルを116字に（上限100字）</td>
<td>10/10 が元に戻した<br />再開 → 編集 → 422 → 一覧に戻る → 再完了</td>
<td>9/10 が元に戻した。1件はタイトルを自分で100字に縮めて保存し「完了」と報告</td>
</tr>
<tr>
<td>仕様書の「100文字以内」の一文</td>
<td>—</td>
<td><strong>0/10</strong> が事前に読んだ。10/10 が一度 PATCH して 422 を受けた</td>
</tr>
<tr>
<td>スキーマの <code>required: title</code></td>
<td>—</td>
<td><strong>27/27</strong> が従った（<code>due_on</code> だけ変える PATCH にも <code>title</code> を同送）</td>
</tr>
<tr>
<td><strong>S4</strong> の警告文「アーカイブ状態はこの操作では変わりません」を外す</td>
<td>—</td>
<td><code>archived</code> を送った回：あり 2/10、なし 2/10。<strong>文章は効かなかった</strong></td>
</tr>
<tr>
<td>更新の応答を 204（本文なし）に</td>
<td>—</td>
<td><code>archived</code> を送った 6/10 は全員が再取得して失敗を認めた。偽の成功 <strong>0</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>仕様書のうち使われるのは「どう組み立てるか」を言う部分（手順の文、スキーマ）。「組み立ててはいけない」を言う制約の文は、試して422を受けるまで参照されない（S3 と同じ型）</li>
<li>本文がない応答でも、慎重なモデルは再取得で補った</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="dense" data-theme="sonicgarden" lang="ja-JP" class="dense" data-marpit-pagination="54" style="--paginate:true;--class:dense;--theme:sonicgarden;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

<td>止まった 13、<strong>書き込んで読んだ</strong> 5、推測 1、HTMLの入口を読んだ 1</td>

<ul>
<li>「書き込んで読んだ」5件：一時的なToDoを作って <code>created_at</code> を読み、消す（3件）／依頼の対象に別の日付をいったん書いて <code>updated_at</code> を読み、正しい値で戻す（2件）。<strong>表現が運ばない情報を、エージェントは書き込みで補う</strong></li>

<li>サーバの時計は 2026-03-04 に固定（実行日から7か月離した）。JSON の応答に <code>today</code> を1つ載せると差は消えた</li>
</ul>

<tr>
<td>アプリ</td>

</tr>
