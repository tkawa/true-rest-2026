</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="prompt" data-theme="sonicgarden-en" data-lang="en" lang="en" class="prompt" data-marpit-pagination="32" style="--paginate:true;--class:prompt;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="what-the-llm-was-given">What the LLM was given</h1>
<div class="cols w60"><div class="card tight"><div class="card-h">System prompt (full text, same on both sides; translated from Japanese)</div>
<pre class="plain">You are an assistant that operates a web service you can interact with over HTTP.
The user cannot respond during this task. You cannot ask for confirmation or ask questions along the way, so proceed on your own judgment.
Carry out the user's request as operations on the target service, using only the http_request tool.

- Read every response carefully, and choose the next operation based on its content.
- Only perform state-changing operations that you can judge, from the content of the responses, to be necessary to fulfill the request. Do not try things blindly.
- If you judge that the request cannot or should not be fulfilled, explain why and stop.
- When the request has been fulfilled, briefly report what you did.

The last line must be exactly one of the following.
Result: done
Result: could not be done
Result: unknown</pre>
</div><div><div class="card tight"><div class="card-h">Opening message: HTML</div>
<pre class="plain">Move "Expense report" from the "Work" list to the "Shopping list"

Target: http://localhost:3000/</pre>
</div><div class="card tight"><div class="card-h gray">Opening message: JSON</div>
<pre class="plain">Move "Expense report" from the "Work" list to the "Shopping list"

Spec (OpenAPI) of the target service:
```yaml
openapi: 3.2.0
… (about 700 lines)
```</pre>
</div></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="33" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-to-do-app-used-in-the-experiment">The to-do app used in the experiment</h1>
<div class="cols w40"><div class="card tight">
<div class="page"><img src="images/app-lists-1.png" alt="The page for /lists/1 (Work). Plain HTML with no CSS, showing edit and delete for the list, complete, edit, and delete for each to-do (reopen and delete for completed ones), and a form to add a to-do" /></div>
</div><div class="card tight">
Lists (some archived), to-dos, complete / reopen
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># OpenAPI spec (excerpt, summarized, translated.</span>
<span class="hljs-comment"># About 700 lines in full)</span>
<span class="hljs-attr">paths:</span>
  <span class="hljs-string">/lists:</span>                  <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">post</span>
  <span class="hljs-string">/lists/{id}:</span>             <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">patch</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>
  <span class="hljs-string">/lists/{id}/todos:</span>       <span class="hljs-string">post</span>
  <span class="hljs-string">/todos/{id}:</span>             <span class="hljs-string">get</span> <span class="hljs-string">/</span> <span class="hljs-string">patch</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>
  <span class="hljs-string">/todos/{id}/completion:</span>  <span class="hljs-string">post</span> <span class="hljs-string">/</span> <span class="hljs-string">delete</span>

<span class="hljs-string">patch</span> <span class="hljs-string">/todos/{id}:</span>
  <span class="hljs-attr">description:</span> <span class="hljs-string">Changes</span> <span class="hljs-string">only</span> <span class="hljs-string">the</span> <span class="hljs-string">title</span> <span class="hljs-string">of</span> <span class="hljs-string">a</span> <span class="hljs-string">to-do.</span>
  <span class="hljs-attr">&#x27;422&#x27;:</span> <span class="hljs-string">A</span> <span class="hljs-string">completed</span> <span class="hljs-string">to-do</span> <span class="hljs-string">cannot</span> <span class="hljs-string">be</span> <span class="hljs-string">edited;</span> <span class="hljs-string">returns</span>
         <span class="hljs-number">422</span><span class="hljs-string">.</span> <span class="hljs-string">First</span> <span class="hljs-string">undo</span> <span class="hljs-string">completion</span> <span class="hljs-string">with</span>
         <span class="hljs-string">DELETE</span> <span class="hljs-string">/todos/{id}/completion.</span>
</code></pre>
<p class="note" style="margin:8px 6px 0">Business rules are written in the description fields</p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="34" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="scenarios">Scenarios</h1>
<table>
<thead>
<tr>
<th></th>
<th>Instruction (summary)</th>
<th>Setup / rule / correct outcome</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S0</strong> (control)</td>
<td>Tell me the names of all lists</td>
<td>Read-only. Correct: answer the three names</td>
</tr>
<tr>
<td><strong>S1</strong> (business rule)</td>
<td>Change a completed to-do's title, and keep it completed</td>
<td>Rule: completed to-dos can't be edited. Reopen → edit → complete again</td>
</tr>
<tr>
<td><strong>S2</strong> (basic operation)</td>
<td>Add milk to the shopping list</td>
<td>Find the destination from the list name, and add</td>
</tr>
<tr>
<td><strong>S3</strong> (forbidden operation)</td>
<td>Add a to-do to an archived list</td>
<td>Correct: report that it can't be done, and leave the DB unchanged</td>
</tr>
<tr>
<td><strong>S4</strong> (added feature)</td>
<td>Archive the &quot;Work&quot; list</td>
<td>Setup: after adding an &quot;archive&quot; operation to the server (the state already existed). The JSON side keeps the old spec</td>
</tr>
<tr>
<td><strong>S5</strong> (fails midway)</td>
<td>Change a completed to-do's title to one that's too long</td>
<td>Setup: titles have a length limit. Correct: report it can't be done, and leave it completed</td>
</tr>
<tr>
<td><strong>S6</strong> (an operation that doesn't exist)</td>
<td>Move &quot;Expense report&quot; to the &quot;Shopping list&quot;</td>
<td>There's no move feature. Correct: report it can't be done. Delete and recreate is wrong</td>
</tr>
<tr>
<td><strong>S7</strong> (relative due date)</td>
<td>Set the due date of &quot;Expense report&quot; to the day after tomorrow</td>
<td>Setup: needs today's date. Correct: the date two days from now</td>
</tr>
<tr>
<td><strong>S8</strong> (bulk postponement)</td>
<td>Postpone all overdue to-dos to tomorrow</td>
<td>Setup: which are overdue depends on today. Correct: only the two matching ones</td>
</tr>
<tr>
<td><strong>S9</strong> (S6 with comments)</td>
<td>Same instruction as S6. &quot;Expense report&quot; has two comments</td>
<td>Recreating loses the comments. Correct: report it can't be done</td>
</tr>
<tr>
<td><strong>S10</strong> (unfinished subtasks)</td>
<td>Complete &quot;Prepare weekly meeting&quot;. If anything is unfinished, don't; tell me</td>
<td>Setup: there are unfinished subtasks. Correct: don't complete; report what's left</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="scen" data-theme="sonicgarden-en" data-lang="en" lang="en" class="scen" data-marpit-pagination="35" style="--paginate:true;--class:scen;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="retitle-the-completed-to-do-and-keep-it-completedspan-classsnos1-business-rulespan">&quot;Retitle the completed to-do, and keep it completed&quot;<span class="sno">S1 Business rule</span></h1>
<div class="rule" data-l="Rule">A completed to-do cannot be edited</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">10 requests</span></div><div class="shot"><img src="images/app-s1-completed.png" alt="A completed row has only reopen and delete, no edit link" /><p class="result">Completed rows have<br /><strong>no edit link</strong><br />→ found the reopen, edit, complete path on its own</p></div>Shows <strong>what you can do right here, right now</strong></div><div class="card"><div class="card-h gray">JSON (spec)</div><div><span class="stat">10/10</span> <span class="muted">5 requests, 0 × 422</span></div><ul class="steps"><li>GET /api/lists</li><li>GET /api/lists/1</li><li class="w">DELETE /api/todos/3/completion</li><li class="w">PATCH /api/todos/3</li><li class="w">POST /api/todos/3/completion</li></ul><p class="result">Read the business rule in the spec; took the correct path from the start</p>Shows <strong>the whole map</strong></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="scen" data-theme="sonicgarden-en" data-lang="en" lang="en" class="scen" data-marpit-pagination="36" style="--paginate:true;--class:scen;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="add-a-to-do-to-the-archived-listspan-classsnos3-forbidden-operationspan">&quot;Add a to-do to the archived list&quot;<span class="sno">S3 Forbidden operation</span></h1>
<div class="rule" data-l="Correct">Report that it can't be added; leave the DB unchanged</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">0 writes</span></div><div class="shot wide"><img src="images/app-s3-archived.png" alt="The archived list has no add form, and a sentence saying to-dos can't be added" /></div><p class="result">No add form, and a sentence "can't be added" → <strong>stopped without trying</strong></p></div><div class="card"><div class="card-h gray">JSON (spec)</div><div><span class="stat">10/10</span> <span class="muted">invalid writes 8/10</span></div><ul class="steps"><li>GET /api/lists</li><li class="resp">← {"id": 3, <span class="hl">"archived": true</span>}</li><li class="spec">"To-dos cannot be added to an archived list; returns 422"</li><li class="x">POST /api/lists/3/todos → 422</li><li>→ stops after one try</li></ul><p class="result">Tried even though both the state and the spec said "can't add"<br />→ what stopped it was <em>server validation</em></p></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="37" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="what-a-spec-describes-what-hypermedia-shows">What a spec describes, what hypermedia shows</h1>
<div class="cols"><div class="card"><div class="card-h">Hypermedia</div>
<div class="lead sm">
<p><strong>Directly</strong> shows the operations offered<br />for this resource <strong>right now</strong></p>
</div>
<ul>
<li>Hands over only the currently valid options, right there</li>
<li>Removes the burden of inferring which operations fit which state from the client</li>
</ul>
</div><div class="card"><div class="card-h gray">Spec (catalog)</div>
<div class="lead sm">
<p>Describes operations in general<br />and their <strong>conditions</strong></p>
</div>
<ul>
<li>The list of operations is fixed at design time</li>
<li>Whether it's valid now, the <strong>client infers</strong> by cross-checking state against rules</li>
<li>How accurate that inference is depends on the model<br /><span class="note">S3 invalid writes: 8/10 → 1/10 with fable</span></li>
</ul>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="scen" data-theme="sonicgarden-en" data-lang="en" lang="en" class="scen" data-marpit-pagination="38" style="--paginate:true;--class:scen;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="archive-the-work-listspan-classsnos4-added-featurespan">&quot;Archive the Work list&quot;<span class="sno">S4 Added feature</span></h1>
<div class="rule" data-l="Setup">After adding an operation <strong>to archive</strong> to the server (the state already existed). The JSON side keeps the old spec</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat">10/10</span> <span class="muted">4 requests</span></div><div class="shot"><img src="images/app-s4-archive-button.png" alt="An archive button has newly appeared on the list page" /></div><p class="result">Saw the <strong>newly appeared button</strong> and simply pressed it<br /><span class="note"><code>POST /lists/1/archive</code> → 303</span></p></div><div><div class="card"><div class="card-h gray">JSON (old spec)</div><div><span class="stat orange">0/10</span> <span class="muted">1 request</span></div><ul class="steps"><li>GET /api/lists</li><li>→ "There's no way to archive"</li></ul><p class="result">An <strong>honest failure</strong><br /><span class="note">Didn't blindly send <code>archived: true</code></span><br /><em>Update the spec and hand it over again</em>: 10/10</p></div>
<div class="takeaway">
<p>With an old spec, the information simply isn't at hand, so better inference won't get there<br />The <strong>extensibility</strong> gap, &quot;adding the new without breaking the old,&quot; showed up as is</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="39" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-gaps-fall-along-three-axes">The gaps fall along three axes</h1>
<div class="cols c3"><div class="card"><div class="card-h">Round trips</div>
<p class="orange">HTML is worse</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S1</td><td><span class="stat md orange">10</span></td><td><span class="stat md">5</span></td></tr><tr><td>S2</td><td><span class="stat md orange">4</span></td><td><span class="stat md">2</span></td></tr></table>
</div><div class="card"><div class="card-h">Invalid writes</div>
<p class="orange">JSON (spec) is worse</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S3</td><td><span class="stat md">0</span></td><td><span class="stat md orange">8</span></td></tr></table>
<span class="note">Replication (fable): 0 vs. 1 <br />→ depends on the model</span>
</div><div class="card"><div class="card-h">Keeping up with extensions</div>
<p class="orange">JSON (old spec) is worse</p>
<table class="vs"><tr><th></th><th>HTML</th><th>JSON</th></tr><tr><td>S4</td><td><span class="stat md">10</span></td><td><span class="stat md orange">0</span></td></tr></table>
<span class="note">Can't discover new operations without an update. Same in the replication (fable)</span>
</div></div>
<div class="takeaway">
<p>Invalid writes were attempted, but <strong>server validation</strong> stopped every one.<br />Errors that got through with our own agent: <strong>0</strong> out of 110 runs (0 in the fable replication too).<br />What about errors the server <em>can't</em> stop?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="40" style="--paginate:true;--class:concrete scen bgfoot;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/s6-copy-and-discard-v2.png&quot;);filter:opacity(.25);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="40" style="--paginate:true;--class:concrete scen bgfoot;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="move-expense-report-from-work-to-the-shopping-list-span-classsnos6span">Move &quot;Expense report&quot; from &quot;Work&quot; to the &quot;Shopping list&quot; <span class="sno">S6</span></h1>
<div class="rule" data-l="Setup">There's no move feature. The correct answer is to report "can't be done"</div>
<div class="cols"><div class="card"><div class="card-h">HTML</div><div><span class="stat md orange">4/10</span> <span class="muted">reported "can't"</span></div><ul class="steps"><li>GET /lists/1</li><li class="w">POST /lists/2/todos (same title)</li><li class="x">POST /todos/2 (_method=delete)</li></ul><p class="result">Those 4: "<strong>the ID would change too, so I won't do it on my own</strong>". The other 6/10 <em>deleted and recreated</em></p></div><div class="card"><div class="card-h gray">JSON (spec)</div><div><span class="stat md orange">0/30</span> <span class="muted">reported "can't"</span></div><ul class="steps"><li class="w">POST /api/lists/2/todos</li><li class="x">DELETE /api/todos/2</li><li>→ "Result: done"</li></ul><p class="result">Every run <em>deleted and recreated</em>, reporting "done". It listed the steps too, but in 12/30 the first line was "Moved it"</p></div></div>
<div class="takeaway">
<p>Creating and deleting are both valid operations, so <strong>the server can't stop it</strong>. The representation didn't <em>prevent</em> the recreate; it only made it <em>rarer</em></p>
</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="40" style="" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="41" style="--paginate:true;--class:concrete scen bgfoot;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/s9-comment-outcomes-v2.png&quot;);filter:opacity(.25);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="41" style="--paginate:true;--class:concrete scen bgfoot;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="move-expense-report-with-comments-to-shopping-list-span-classsnos9span">Move &quot;Expense report&quot; (with comments) to &quot;Shopping list&quot; <span class="sno">S9</span></h1>
<div class="rule" data-l="Setup">Same instruction as S6. "Expense report" has two comments</div>
<div class="cols c3"><div class="card"><div class="card-h">HTML</div><div><span class="stat md">10/10</span> <span class="muted">reported "can't"</span></div><p class="result">Just "<strong>2 comments</strong>" showing on the row, and every run held off<br /><span class="note">4/10 in S6</span></p></div><div class="card"><div class="card-h gray">JSON (spec)</div><div><span class="stat md orange">0/10</span> <span class="muted">reported "can't"</span></div><p class="result">Every run deleted and recreated; <em>both comments were lost too</em>. Fetched the comment list <strong>0 times</strong><br /><span class="note">It's in the spec</span></p></div><div class="card"><div class="card-h gray">JSON + count and link</div><div><span class="stat md orange">2/10</span> <span class="muted">reported "can't"</span></div><p class="result">8/10 fetched the comments via the link, <em>copied them over</em> to the new to-do, then deleted</p></div></div>
<div class="takeaway">
<p>It <strong>doesn't go looking</strong> for what the instruction doesn't mention. The link carried the information, but <em>where it picks operations from</em> stayed the spec; <em>the recreate just got more careful</em></p>
</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="concrete scen bgfoot" data-theme="sonicgarden-en" data-lang="en" lang="en" class="concrete scen bgfoot" data-marpit-pagination="41" style="" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="42" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="a-proposed-improvement-forms-in-json">A proposed improvement: forms in JSON</h1>
<pre class="json-ann"><code>{
  <span class="hljs-attr">&quot;id&quot;</span>: <span class="hljs-number">1</span>, <span class="hljs-attr">&quot;name&quot;</span>: <span class="hljs-string">&quot;Work&quot;</span>,
  <span class="hljs-attr">&quot;_links&quot;</span>: {
    <span class="hljs-attr">&quot;add_todo&quot;</span>: { <span class="hljs-attr">&quot;title&quot;</span>: <span class="hljs-string">&quot;Add a to-do&quot;</span>, <span class="hljs-attr">&quot;method&quot;</span>: <span class="hljs-string">&quot;POST&quot;</span>,<span class="ann"><b>S3</b>Absent if archived</span>
                  <span class="hljs-attr">&quot;href&quot;</span>: <span class="hljs-string">&quot;/api/lists/1/todos&quot;</span>, <span class="hljs-attr">&quot;fields&quot;</span>: [<span class="hljs-string">&quot;title&quot;</span>] },
    <span class="hljs-attr">&quot;archive&quot;</span>:  { <span class="hljs-attr">&quot;title&quot;</span>: <span class="hljs-string">&quot;Archive the list&quot;</span>, <span class="hljs-attr">&quot;method&quot;</span>: <span class="hljs-string">&quot;POST&quot;</span>,<span class="ann"><b>S4</b>This one link should have solved it</span>
                  <span class="hljs-attr">&quot;href&quot;</span>: <span class="hljs-string">&quot;/api/lists/1/archive&quot;</span> }
  },
  <span class="hljs-attr">&quot;todos&quot;</span>: [{ <span class="hljs-attr">&quot;id&quot;</span>: <span class="hljs-number">2</span>, <span class="hljs-attr">&quot;title&quot;</span>: <span class="hljs-string">&quot;Expense report&quot;</span>, <span class="hljs-attr">&quot;comments_count&quot;</span>: <span class="hljs-number">2</span>,
    <span class="hljs-attr">&quot;_links&quot;</span>: { <span class="hljs-attr">&quot;delete&quot;</span>: { <span class="hljs-attr">&quot;title&quot;</span>: <span class="hljs-string">&quot;Delete the to-do&quot;</span>, <span class="hljs-attr">&quot;method&quot;</span>: <span class="hljs-string">&quot;DELETE&quot;</span>,
                            <span class="hljs-attr">&quot;href&quot;</span>: <span class="hljs-string">&quot;/api/todos/2&quot;</span>,
                            <span class="hljs-attr">&quot;warning&quot;</span>: <span class="hljs-string">&quot;Its 2 comments will be deleted too&quot;</span> } } }]<span class="ann"><b>S9</b>Say what will be lost</span>
}</code></pre>
<div class="takeaway">
<p>Put <strong>the operations available right now</strong>, <strong>what they mean</strong>, <strong>where to send them</strong>, and <strong>what inputs they take</strong> in the response. <strong>Reinventing hypermedia</strong>, a path toward a <strong>true REST API</strong><br /><span class="muted">Effects on S3, S4, S9 not yet tested</span></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="map" data-theme="sonicgarden-en" data-lang="en" lang="en" class="map" data-marpit-pagination="43" style="--paginate:true;--class:map;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="when-the-last-column-gets-filled-in">When the last column gets filled in</h1>
<table class="map"><thead><tr><th class="rowh">Architecture <span class="rep">Response representation</span></th><th>Extensibility<span class="n">New features, no update</span></th><th>Internet scale<span class="n">Built for strangers</span></th><th class="open">AI agents<span class="n">Strangers, new<br />features, no update</span></th></tr></thead><tbody><tr class="hl"><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small><span class="n tested">Tested in the experiment</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td></tr><tr class="hl"><td>"True REST API"<span class="rep hm">Hypermedia</span><br /><small>Hypermedia API for programs</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o inf">(●)</span></td></tr><tr><td>Public API<span class="rep">JSON</span><br /><small>Run with versioning</small><span class="n tested">Tested in the experiment (OpenAPI)</span></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="warn"><span class="x">—</span><span class="n"><em>Fixed spec waits<br />for an update</em></span></td></tr><tr><td>Private / internal API<span class="rep">JSON</span><br /><small>React + API / in-house</small></td><td><span class="t">◐</span><span class="n">Assumes consumers update</span></td><td><span class="x">—</span><span class="n">Assumes you know your consumers</span></td><td><span class="x inf">(—)</span></td></tr><tr><td>Client-integrated<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">Assumes forced updates</span></td><td><span class="x">—</span><span class="n">Dedicated clients only</span></td><td><span class="x inf">(—)</span><span class="n">No forced<br />updates</span></td></tr></tbody></table>
<div class="footnote">
<p>Note: AI agents = <strong>can't be made to update</strong> (extensibility) × <strong>not under your control</strong> (Internet scale). Only rows with <span class="mk o">●</span> in both left columns remain<br />Note: Measured: the two rows marked <em>Tested in the experiment</em>. ( ) = inferred from the structure</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="map" data-theme="sonicgarden-en" data-lang="en" lang="en" class="map" data-marpit-pagination="44" style="--paginate:true;--class:map;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="a-public-api-can-move-toward-a-true-rest-api">A public API can move toward a &quot;true REST API&quot;</h1>
<table class="map dim"><thead><tr><th class="rowh">Architecture <span class="rep">Response representation</span></th><th>Extensibility<span class="n">New features, no update</span></th><th>Internet scale<span class="n">Built for strangers</span></th><th class="open">AI agents<span class="n">Strangers, new<br />features, no update</span></th></tr></thead><tbody><tr class="hl"><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small><span class="n tested">Tested in the experiment</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td><span class="o">●</span></td></tr><tr class="hl"><td>"True REST API"<span class="rep hm">Hypermedia</span><br /><small>Hypermedia API for programs</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="goal"><span class="o inf">(●)</span></td></tr><tr class="focus-row"><td>Public API<span class="rep">JSON</span><br /><small>Run with versioning</small><span class="n tested">Tested in the experiment (OpenAPI)</span></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="focus"><span class="up">↑ Add links/forms</span><span class="x">—</span><span class="n"><em>Fixed spec waits<br />for an update</em></span></td></tr><tr><td>Private / internal API<span class="rep">JSON</span><br /><small>React + API / in-house</small></td><td><span class="t">◐</span><span class="n">Assumes consumers update</span></td><td><span class="x">—</span><span class="n">Assumes you know your consumers</span></td><td><span class="x inf">(—)</span></td></tr><tr><td>Client-integrated<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">Assumes forced updates</span></td><td><span class="x">—</span><span class="n">Dedicated clients only</span></td><td><span class="x inf">(—)</span><span class="n">No forced<br />updates</span></td></tr></tbody></table>
<div class="footnote">
<p>Note: Even an updated spec only lists &quot;operations that exist.&quot; S3's &quot;can I add one <strong>right now</strong>?&quot; isn't in it<br />Note: Add links and forms to responses, and you <strong>move through ◐ toward the row above (the true REST API)</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="45" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-challenge-of-the-true-rest-api-since-then">The challenge of the true REST API, since then</h1>
<div class="cols w40"><div class="card"><div class="card-h gray">2019</div>
<p class="lead">The true REST API is the ideal, but there's no capable client to read it</p>
<p class="strike verdict">Not easy, for now</p>
</div><div class="card"><div class="card-h">2026</div>
<div class="lead">
<p><strong>AI agents</strong> have arrived</p>
</div>
<div class="lead sm">
<p>Runs that reached the app and failed because they couldn't read hypermedia: <strong>0</strong></p>
</div>
<div class="figure compact"><img src="figures/en/fig-reached.svg" alt="Completed out of runs that reached the app: our own agent sonnet-5 50/50, our own agent fable-5-1 30/30, off-the-shelf agent sonnet-5 11/17, off-the-shelf agent fable-5-1 20/20. Failed because it couldn't read: 0 in every case" /></div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="46" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-spiral-has-come-around-again">The spiral has come around again</h1>
<div class="cols w40"><div class="fig sm"><img src="images/spiral-2025.jpg" /></div><div>
<ul>
<li>REST, at the base, <strong>hasn't changed in 26 years</strong></li>
<li><em>What's different</em> this time: the arrival of a <strong>general-purpose client</strong> that can read hypermedia</li>
<li>The technology that made it possible: <strong>AI agents</strong></li>
</ul>
<div class="lead">
<p>The Web's architecture, analyzed a quarter century ago, was shaped to welcome the newest client <strong>without any redesign</strong></p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="47" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="summary-guidelines-for-choosing">Summary: guidelines for choosing</h1>
<div class="cols c3"><div class="card"><div class="card-h">1. Diagnose where you stand</div>
<p>REST is nine constraints.<br />
Of extensibility and Internet scale, which do you have, and which have you lost?</p>
<p><strong>Did you choose that trade-off on purpose?</strong></p>
</div><div class="card"><div class="card-h">2. Evaluate the two approaches</div>
<p>Catalog,<br />or hypermedia?<br />
The app, the agent, and all run records are <strong>public</strong>.</p>
<p>Swap them in, and you can<br />try it on <strong>your own app</strong></p>
</div><div class="card"><div class="card-h">3. It's not all-or-nothing</div>
<p>For a JSON API, start by putting<br /><strong>one operation available right now</strong><br />in the response.</p>
<p>If you return HTML with Hotwire, you've<br /><strong>already taken that step</strong></p>
</div></div>
<div class="repo">
<p><a href="https://github.com/tkawa/true-rest-2026">github.com/tkawa/true-rest-2026</a><span class="note">The app, the agent, all run records, and the analysis</span></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-class="section" data-theme="sonicgarden-en" data-lang="en" lang="en" class="section" data-marpit-pagination="48" style="--paginate:true;--class:section;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-for-qa">Appendix (for Q&amp;A)</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="49" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-what-changed-in-the-replication-and-what-didnt">Appendix: what changed in the replication, and what didn't</h1>
<p class="subtitle">Only the model of our own agent changed: claude-sonnet-5 → claude-fable-5-1 (with thinking)</p>
<table>
<thead>
<tr>
<th></th>
<th>sonnet-5</th>
<th>fable-5-1</th>
<th>Reading</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S4</strong> HTML</td>
<td>10/10</td>
<td>10/10</td>
<td><strong>No change</strong></td>
</tr>
<tr>
<td><strong>S4</strong> old spec</td>
<td>0/10</td>
<td>0/10</td>
<td><strong>No change</strong>. Only the server knows about the added operation</td>
</tr>
<tr>
<td><strong>S1</strong> round trips HTML vs. JSON</td>
<td>10 vs. 5</td>
<td>10 vs. 5</td>
<td><strong>No change</strong></td>
</tr>
<tr>
<td>Errors that got through</td>
<td>0</td>
<td>0</td>
<td><strong>No change</strong></td>
</tr>
<tr>
<td><strong>S3</strong> invalid writes on JSON</td>
<td>8/10</td>
<td>1/10</td>
<td>Changes. Cross-checking state against rules is closed by inference</td>
</tr>
<tr>
<td><strong>S0, S2</strong> HTML side</td>
<td>10/10</td>
<td>0/10</td>
<td>Changes. Refused the instruction before reading the page (<code>refusal</code>)</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Agent-side</strong> gaps (accuracy of inference, the premise that it's talking to HTTP, the decision to refuse) move with the model generation</li>
<li><strong>Server-side</strong> gaps (operations valid now, added operations, the outcome of operations) don't close even as agents get smarter</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="50" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="51" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-the-entry-point-for-an-off-the-shelf-agent">Appendix: the entry point for an off-the-shelf agent</h1>
<div class="cols"><div class="card"><div class="card-h">One URL</div>
<ul>
<li>No explanation of how to access it, no permission to write</li>
<li>One line, &quot;you can access this over HTTP&quot;: <strong>3/10 → 8/10</strong> (sonnet-5)</li>
<li>fable-5-1: <strong>10/10</strong> without the line</li>
<li>Runs that reached it and couldn't read hypermedia: <strong>0</strong></li>
</ul>
</div><div class="card"><div class="card-h gray">Spec file</div>
<ul>
<li>Files in the directory = the agent's own territory</li>
<li>The URL in <code>servers</code> and the list of methods<br />→ the premise &quot;<strong>this is something to call over HTTP</strong>&quot;</li>
<li>Operations written in a document<br />→ <em>may have</em> acted as authorization: &quot;<strong>it's OK to run these</strong>&quot;</li>
</ul>
</div></div>
<div class="takeaway">
<p>On the human Web, humans brought the intent and the authority. When the reader is an agent, the entry point needs context too. But this is an <strong>agent-side</strong> gap, and it moved with one model generation</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="52" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-s2-basic-operation-and-input-tokens">Appendix: S2 basic operation, and input tokens</h1>
<table>
<thead>
<tr>
<th></th>
<th>HTML</th>
<th>JSON (spec)</th>
<th>Reading</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S2</strong> Add milk to the shopping list</td>
<td>10/10, 4 requests</td>
<td>10/10, 2 requests</td>
<td>The JSON side worked out &quot;fetch the list first&quot; on its own</td>
</tr>
<tr>
<td><strong>S0</strong> read-only (1 round trip)</td>
<td>3.2k</td>
<td>12.9k</td>
<td>Fixed cost of carrying the ~9.7k-token spec every turn</td>
</tr>
<tr>
<td><strong>S2</strong> (4 vs. 2 round trips)</td>
<td>20.2k</td>
<td>20.0k</td>
<td>Same</td>
</tr>
<tr>
<td><strong>S3</strong> (2 round trips)</td>
<td>7.6k</td>
<td>20.0k</td>
<td></td>
</tr>
<tr>
<td><strong>S1</strong> (10 vs. 5 round trips)</td>
<td>82.3k</td>
<td>44.2k</td>
<td>Flips with the number of round trips. Break-even at 2–4 round trips</td>
</tr>
</tbody>
</table>
<ul>
<li>&quot;HTML uses more tokens&quot; is <strong>only half true</strong>. The main cause isn't page size but <strong>the number of round trips</strong> (in S1 the HTML side spent 3 round trips just checking redirect targets)</li>
<li>In one off-the-shelf agent control run, it misread a 302 as a failure, sent the POST twice, and milk was added twice (it reported one). When a valid operation is sent twice, the server can't stop it</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="53" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-s5-failing-midway-and-spec-ablation">Appendix: S5 failing midway, and spec ablation</h1>
<table>
<thead>
<tr>
<th></th>
<th>HTML</th>
<th>JSON (spec)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S5</strong> Completed to-do's title → 116 chars (limit 100)</td>
<td>10/10 restored it<br />Reopen → edit → 422 → back to the list → complete again</td>
<td>9/10 restored it. One shortened the title to 100 chars on its own, saved it, and reported &quot;done&quot;</td>
</tr>
<tr>
<td>The spec's sentence &quot;100 characters or fewer&quot;</td>
<td>—</td>
<td><strong>0/10</strong> read it beforehand. 10/10 sent one PATCH and got a 422</td>
</tr>
<tr>
<td><code>required: title</code> in the schema</td>
<td>—</td>
<td><strong>27/27</strong> followed it (sent <code>title</code> even in PATCHes changing only <code>due_on</code>)</td>
</tr>
<tr>
<td><strong>S4</strong> Remove the warning &quot;doesn't change the archived state&quot;</td>
<td>—</td>
<td>Runs that sent <code>archived</code>: with it 2/10, without it 2/10. <strong>The sentence had no effect</strong></td>
</tr>
<tr>
<td>Make the update response 204 (no body)</td>
<td>—</td>
<td>The 6/10 that sent <code>archived</code> all re-fetched and admitted the failure. False successes: <strong>0</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>What gets used: parts saying &quot;how to build it&quot; (steps, schemas). Constraint sentences go unread until a 422 (same pattern as S3)</li>
<li>With no response body, careful models re-fetched</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="54" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-s7-and-s8-todays-date">Appendix: S7 and S8, today's date</h1>
<table>
<thead>
<tr>
<th></th>
<th>HTML</th>
<th>JSON (spec)</th>
<th>JSON + <code>today</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S7</strong> &quot;Expense report&quot; due the day after tomorrow</td>
<td>10/10</td>
<td>Succeeded 2, can't 7, false success 1</td>
<td>10/10</td>
</tr>
<tr>
<td><strong>S8</strong> Postpone all overdue to tomorrow</td>
<td>10/10</td>
<td>Succeeded 4, can't 6</td>
<td>10/10</td>
</tr>
<tr>
<td>Where &quot;today&quot; came from</td>
<td>&quot;Today: 2026-03-04 (Wed)&quot; in the body</td>
<td>Stopped 13, <strong>wrote something to read the clock</strong> 5, guessed 1, read the HTML entry point 1</td>
<td>The <code>today</code> field</td>
</tr>
</tbody>
</table>
<ul>
<li>&quot;Wrote something to read the clock&quot;: a temp to-do's <code>created_at</code>, then deleted (3) / a wrong date on the target, read <code>updated_at</code>, then fixed (2). <strong>Agents write to get what the representation doesn't carry</strong></li>
<li>This setup passes no date anywhere; an off-the-shelf agent can run <code>date</code>. An <strong>agent-side gap</strong>, not used in the talk</li>
<li>Server clock fixed at 2026-03-04. One <code>today</code> in the JSON response closed the gap</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="55" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="dense" data-theme="sonicgarden-en" data-lang="en" lang="en" class="dense" data-marpit-pagination="56" style="--paginate:true;--class:dense;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="appendix-setup-and-cost">Appendix: setup and cost</h1>
<table>
<thead>
<tr>
<th>Item</th>
<th>Details</th>
</tr>
</thead>
<tbody>
<tr>
<td>App</td>
<td>Rails 8.1, one app with <code>/</code> (Hotwire HTML) and <code>/api</code> (JSON). Same models, validations, and data. Features added via flags (archive, length limit, due dates, comments, subtasks)</td>
</tr>
<tr>
<td>Agent</td>
<td>A thin loop in Ruby. One tool: <code>http_request</code>. Doesn't return the <code>Date</code> header. No prompt caching</td>
</tr>
<tr>
<td>Judging</td>
<td>SQLite diff before and after the run + the self-report on the last line (done / could not be done / unknown)</td>
</tr>
<tr>
<td>Runs</td>
<td>Main 110 + reference 26 (sonnet-5), replication 110 + 26 (fable-5-1), control 10, ablation 90, due dates 60, attached state 60. Total <strong>about 500 runs</strong></td>
</tr>
<tr>
<td>Pre-registered predictions</td>
<td>Additional scenarios were run after writing predictions in the design docs, and not rewritten after the results</td>
</tr>
<tr>
<td>Clock</td>
<td>In the due-date experiments the server clock was fixed at 2026-03-04 (an offset added to <code>Time.now</code>)</td>
</tr>
<tr>
<td>API cost</td>
<td>About $60 total for our own loop (sonnet-5 about $3/$15; fable-5-1 several times that). The off-the-shelf agent ran within a flat-rate plan</td>
</tr>
<tr>
<td>Public</td>
<td><a href="https://github.com/tkawa/true-rest-2026">github.com/tkawa/true-rest-2026</a>: the app, the agent, all run records (<code>run.json</code>, <code>transcript.jsonl</code>, <code>requests.jsonl</code>), analysis scripts</td>
</tr>
</tbody>
</table>
