<text x="80" y="768" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal" >完遂: Cookie とフォームごとの CSRF トークンを自力で扱い、フォームを送信して追加</text>
<rect x="820" y="752" width="30" height="22" rx="4" fill="#0b0b0b"/>
<text x="860" y="768" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal" >巻き添え: 302 を失敗と読み違えて POST を二度送り、牛乳が 2 件入った（報告は 1 件）</text>
<text x="40" y="812" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >到達した HTML 側の実行のうち、ハイパーメディアを読めずに失敗した回は 0（sonnet-5 17 件、fable-5.1 20 件）。sonnet-5 の失敗はエージェント側の既定の姿勢（ツールの選び方、確認を取る癖）による。</text>
<text x="40" y="838" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >CLI だけを上げた対照が本番とほぼ同じ（4/10）なので、fable-5.1 の 10/10 はモデルの差。同じ fable-5.1 でも、自作ループでは URL 一つと短い指示が API の安全機構で止まる（主表の脚注）。</text>
<text x="40" y="864" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >--setting-sources &quot;&quot;、~/.claude/CLAUDE.md なし、空の一時ディレクトリ。sonnet-5 は 2026-09-19〜20、対照と fable-5.1 は 2026-09-27。</text>
