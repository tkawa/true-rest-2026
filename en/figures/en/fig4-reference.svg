<text x="40" y="812" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >Of the HTML runs that reached the app, 0 failed because they couldn&#x27;t read hypermedia (17 with sonnet-5, 20 with fable-5.1). The sonnet-5 failures came from the agent&#x27;s default stance (tool choice, habit of asking first).</text>
<text x="40" y="838" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >The CLI-only control is close to the main run (4/10), so fable-5.1&#x27;s 10/10 is a model difference. With our own loop, fable-5.1 refuses a single URL plus a short instruction (API safety mechanism).</text>
<text x="40" y="864" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal" >--setting-sources &quot;&quot;, no ~/.claude/CLAUDE.md, empty temp directory. sonnet-5 on 2026-09-19–20; the control and fable-5.1 on 2026-09-27.</text>
