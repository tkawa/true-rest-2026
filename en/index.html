<h1 id="tkawa">@tkawa</h1>
<div class="cols w40 me"><div>
<img class="avatar sm" src="images/talks/tkawa-avatar.jpg" alt="" />
<p><strong>Toru Kawamura</strong></p>
<ul>
<li>SonicGarden Inc.</li>
<li>The &quot;REST guy&quot; (RESTafarian)</li>
<li>Organizer of Sendagaya.rb<br /><span class="note">w/ @fukajun　Mondays 21:00- online</span><br /><small><a href="https://sendagayarb.doorkeeper.jp/">https://sendagayarb.doorkeeper.jp/</a></small></li>
</ul>
</div><div>
<p class="covers-h">Many talks on REST and hypermedia</p>
<div class="covers"><div class="row"><figure class="w43"><img src="images/talks/rubykaigi2013.jpg" alt="Rails Gems realize RESTful modeling patterns" /><figcaption>RubyKaigi 2013</figcaption></figure><figure class="w43"><img src="images/talks/rubykaigi2014.jpg" alt="Hypermedia: The Missing Element" /><figcaption>RubyKaigi 2014</figcaption></figure><figure class="w169"><img src="images/talks/rubykaigi2016.jpg" alt="Web Clients for Ruby" /><figcaption>RubyKaigi 2016</figcaption></figure></div><div class="row"><figure class="w43 hl"><img src="images/talks/heiseirubykaigi01-2019.jpg" alt="True REST" /><figcaption>Heisei Ruby Kaigi 01 (2019)<b>Today: the 2026 edition</b></figcaption></figure><figure class="w169"><img src="images/talks/kaigionrails2024.jpg" alt="Cache to Your Advantage" /><figcaption>Kaigi on Rails 2024</figcaption></figure></div></div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="3" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-2000%E2%80%93">REST (2000–)</h1>
<div class="cols"><div>
<ul>
<li>REST API?</li>
<li>GraphQL?　gRPC?　tRPC?</li>
<li>React Server Components (RSC)?</li>
<li>MCP?</li>
<li>…</li>
</ul>
</div><div class="card">
<p>2019 (Heisei Ruby Kaigi 01, &quot;True REST&quot;)<br />
<br /><strong>&quot;REST is old. These days it's ○○.&quot;</strong></p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="4" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-spiral-of-technology">The &quot;spiral&quot; of technology</h1>
<div class="cols w66"><div class="fig sm"><img src="images/spiral-2025.jpg" /></div><div class="card">
<ul>
<li>Technology seems to swing like a <strong>pendulum</strong>, but it's actually a <strong>spiral</strong></li>
<li>It never comes back to the same place</li>
<li>Look at <em>what's different</em>, and the technology that made it possible</li>
</ul>
<p>REST: survived SOAP vs. REST; 26 years on, it's &quot;the base of the spiral&quot;</p>
</div></div>
<p><cite class="src">@t_wada <a href="https://speakerdeck.com/twada/understanding-the-spiral-of-technologies-2025-edition">https://speakerdeck.com/twada/understanding-the-spiral-of-technologies-2025-edition</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="sonicgarden-en" data-lang="en" lang="en" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-is-notbrurl-design">REST is not<br />URL design</h1>
<p>Plural nouns, no verbs… those are naming conventions</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="section" data-theme="sonicgarden-en" data-lang="en" lang="en" class="section" data-marpit-pagination="6" style="--paginate:true;--class:section;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-is-notbrcrud">REST is not<br />CRUD</h1>
<p>Mapping HTTP methods to CRUD (Create/Read/Update/Delete) is not the definition of REST</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="7" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="crud-is-a-rails-convention-rest-is-a-web-constraint">CRUD is a Rails convention; REST is a Web constraint</h1>
<div class="cols"><div class="card"><div class="card-h">The CRUD convention (Rails 1.2, 2007)</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ruby">resources <span class="hljs-symbol">:articles</span>
</code></pre>
<ul>
<li>Fit everything into seven actions</li>
<li>Constrain the design to gain consistency and productivity</li>
<li>DHH brought it into Rails, inspired by REST<br /><strong>A convention born from REST, but not REST itself</strong></li>
</ul>
</div><div class="card"><div class="card-h">The REST constraints (Fielding, 2000)</div>
<ul>
<li><strong>A set of nine architectural constraints</strong><br />that make a <strong>distributed system</strong> like the Web work</li>
<li>The number of methods and how they map is not the point</li>
<li>HTML forms have <strong>only GET and POST</strong><br />
→ and yet the Web satisfies REST</li>
</ul>
</div></div>
<div class="lead sm">
<p>Following Rails conventions and satisfying REST constraints are <strong>two different things</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="fielding-history" data-theme="sonicgarden-en" data-lang="en" lang="en" class="fielding-history" data-marpit-pagination="8" style="--paginate:true;--class:fielding-history;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-creator-of-rest-roy-t-fielding">The creator of REST: Roy T. Fielding</h1>
<div class="history-intro"><div>The person who built the Web<br /><strong>analyzed the Web's architecture</strong></div><img src="images/fielding.jpg" alt="Roy T. Fielding" /></div>
<div class="history-timeline"><div><b>c. 1995</b><i></i><span>Apache</span><small>Co-founder</small></div><div><b>1996</b><i></i><span>HTTP/1.0</span><small>RFC 1945 co-author</small></div><div><b>1997</b><i></i><span>HTTP/1.1</span><small>RFC 2068 lead author</small></div><div class="rest-origin"><b>2000</b><i></i><span>REST</span><small>Defined in his dissertation</small></div><div><b>2022</b><i></i><span>HTTP<br />Semantics</span><small>RFC 9110 co-editor</small></div><div><b>2025</b><i></i><span>QUERY</span><small>Reviewed the draft</small></div></div>
<p><cite class="src">Photo: <a href="https://roy.gbiv.com/">https://roy.gbiv.com/</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="9" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-is-nine-constraints">REST is nine constraints</h1>
<div class="rest"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"></div></div><div class="layer http"><b>HTTP</b><div class="cs"></div></div><div class="layer url"><b>URL</b><div class="cs"></div></div><span class="tag">REST</span></div><div class="js">JavaScript</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="10" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-is-nine-constraints-1">REST is nine constraints</h1>
<div class="rest"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>Manipulation of<br />resources through<br />representations</span><span>Self-descriptive<br />messages</span><span>Hypermedia</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>Client-server</span><span>Stateless</span><span>Cache</span><span>Layered<br />system</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>Identification of resources</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>Code on demand<br />(optional)</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="11" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-is-nine-constraints-2">REST is nine constraints</h1>
<div class="rest focus"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>Manipulation of<br />resources through<br />representations</span><span>Self-descriptive<br />messages</span><span>Hypermedia</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>Client-server</span><span>Stateless</span><span>Cache</span><span>Layered<br />system</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>Identification of resources</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>Code on demand<br />(optional)</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="12" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="manipulation-of-resources-through-representations">Manipulation of resources through representations</h1>
<div class="cols w40"><div>
<ul>
<li>HTML and JSON aren't the resource itself;<br />they're <strong>representations</strong> of it</li>
<li>REST = <strong>RE</strong>presentational <strong>S</strong>tate <strong>T</strong>ransfer</li>
<li><strong>Read</strong> by receiving a representation;<br /><strong>change</strong> by sending one</li>
</ul>
</div><div class="card tight">
<div class="figure"><img src="figures/en/fig-representation.svg" alt="The client receives a representation, an HTML document, with GET, and changes the article by sending a form representation. The resource itself stays on the server and is identified by a URL" /></div>
<p>Never touch the resource itself; exchange <strong>representations</strong></p>
</div></div>
<div class="footnote">
<p>Note: Form representations: <code>application/x-www-form-urlencoded</code>, <code>multipart/form-data</code>, etc.<br />
HTML forms use POST; Rails reads <code>_method</code> and treats it as PUT/PATCH (a Rails convention)</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="13" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="you-can-choose-a-representation">You can choose a representation</h1>
<div class="cols w60"><div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ruby"><span class="hljs-keyword">def</span> <span class="hljs-title function_">show</span>
  <span class="hljs-variable">@article</span> = <span class="hljs-title class_">Article</span>.find(params[<span class="hljs-symbol">:id</span>])
  respond_to <span class="hljs-keyword">do</span> |<span class="hljs-params">format</span>|
    format.html <span class="hljs-comment"># text/html</span>
    format.json <span class="hljs-comment"># application/json</span>
    format.md   <span class="hljs-comment"># text/markdown (Rails 8.1+)</span>
  <span class="hljs-keyword">end</span>
<span class="hljs-keyword">end</span>
</code></pre>
</div><div>
<pre class="http"><code><span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: text/html
<span class="res"><span class="mk">&lt;</span> Content-Type: text/html</span>

<span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: application/json
<span class="res"><span class="mk">&lt;</span> Content-Type: application/json</span>

<span class="mk">&gt;</span> GET /articles/1
<span class="mk">&gt;</span> Accept: text/markdown
<span class="res"><span class="mk">&lt;</span> Content-Type: text/markdown</span></code></pre>
<p><strong>Content negotiation</strong><br />with the <code>Accept</code> header</p>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="14" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="self-descriptive-messages">Self-descriptive messages</h1>
<div class="cols"><div>
<ul>
<li>A message alone carries everything needed to interpret it</li>
<li>It <strong>declares itself</strong>:<br /><code>Content-Type: text/html</code></li>
<li>May it be cached? For how long?<br /><code>Cache-Control: max-age=3600</code><br />= may be cached for 3600 seconds</li>
</ul>
</div><div class="card tight">
<p><img src="images/cache.png" alt="" /></p>
</div></div>
<div class="detail">
<blockquote>
<p>the best application performance is obtained by <strong>not using the network</strong> — Fielding (2000)</p>
</blockquote>
</div>
<div class="footnote">
<p>Note: HTTP headers carry it, but what a message declares, and whether it may be cached, is decided per representation (<code>Content-Type</code>, <code>ETag</code>)</p>
</div>
<p><cite class="src">Image: <a href="https://speakerdeck.com/koriym/rest-6-plus-4falsezhi-yue">https://speakerdeck.com/koriym/rest-6-plus-4falsezhi-yue</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="15" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="hypermedia--hypertext">Hypermedia = Hypertext</h1>
<div class="cols w40"><div class="card tight">
<p><img src="images/messages.png" alt="" /></p>
</div><div>
<ul>
<li><strong>Hypertext</strong>: text documents linked to each other　<strong>HT</strong>ML / <strong>HT</strong>TP</li>
<li><strong>Hypermedia</strong>: not limited to text;<br />includes images, video, <strong>forms</strong>, and more</li>
<li>Each response contains a &quot;menu&quot; of<br /><strong>what you can do next</strong> (links and forms)</li>
<li>The client doesn't need to know<br />URLs in advance</li>
<li>What we do in the browser every day</li>
</ul>
</div></div>
<div class="flow"><span>Read the page</span><i></i><span>Pick a link or form</span><i></i><span>Send it</span><i></i><span>Read the next page</span></div>
<p><cite class="src">Leonard Richardson, Mike Amundsen &quot;RESTful Web APIs&quot; (2013)</cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="16" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="rest-apis-must-be-hypertext-driven">REST APIs must be hypertext-driven</h1>
<div class="cols w60"><div>
<div class="quote lg">
<p>if the engine of application state (and hence the API) is <strong>not being driven by hypertext</strong>, then it cannot be RESTful and cannot be a REST API. <em>Period.</em></p>
</div>
</div><div class="card tight">
<p><img src="images/untangled.jpg" alt="" /></p>
</div></div>
<p><cite class="src">Roy T. Fielding &quot;REST APIs must be hypertext-driven&quot; (2008) <a href="https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven">https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven</a></cite></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="17" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-top-three-in-one-line">The top three, in one line</h1>
<div class="rest focus"><div class="frame"><div class="layer html"><b>HTML</b><div class="cs"><span>Manipulation of<br />resources through<br />representations</span><span>Self-descriptive<br />messages</span><span>Hypermedia</span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>Client-server</span><span>Stateless</span><span>Cache</span><span>Layered<br />system</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>Identification of resources</span></div></div><span class="tag">REST</span></div><div class="js">JavaScript<small>Code on demand<br />(optional)</small></div></div>
<div class="lead rest-cap">
<p>Receive a <strong>representation</strong> of a resource, interpret the <strong>message</strong>, and pick the <strong>next action</strong> it shows<br /><span class="muted">What browsers and humans do every day</span></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="18" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="two-representations-of-the-same-article">Two representations of the same article</h1>
<div class="cols"><div class="card"><div class="card-h">HTML</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>True REST<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>REST is a set of nine…<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/articles/123/edit&quot;</span>&gt;</span>Edit<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/authors/45&quot;</span>&gt;</span>Author<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;/articles/123&quot;</span>
        <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;post&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;hidden&quot;</span>
      <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;_method&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;delete&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">button</span>&gt;</span>Delete<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
</code></pre>
<div class="result">
<p>What you can do next is <strong>in the response</strong></p>
</div>
</div><div><div class="card"><div class="card-h gray">JSON (one example)</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">123</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;True REST&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;body&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;REST is a set of nine…&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;author_id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">45</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<div class="result">
<p>What you can do next is <strong>all known by the client</strong></p>
</div></div>
<div class="note" style="margin:16px 0 0">
<p>Note: HTML forms use POST; Rails reads <code>_method=delete</code> and treats it as DELETE (a Rails convention)</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="19" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-nine-constraints-for-a-json-api">The nine constraints (for a JSON API)</h1>
<div class="rest"><div class="frame"><div class="float"><i></i><i></i><span>Hypermedia</span></div><div class="layer json"><b>JSON</b><div class="cs"><span class="part">Manipulation of<br />resources through<br />representations<small>Receives them;<br />what to send: the spec</small></span><span class="part">Self-descriptive<br />messages<small>Declares JSON;<br />meaning: the spec</small></span><span class="gone">None<small>What you can do next<br />isn't in the response</small></span></div></div><div class="layer http"><b>HTTP</b><div class="cs"><span>Client-server</span><span>Stateless</span><span>Cache</span><span>Layered<br />system</span></div></div><div class="layer url"><b>URL</b><div class="cs"><span>Identification of resources</span></div></div><span class="tag gray"><s>REST</s></span></div><div class="js">JavaScript<small>Code on demand<br />(optional)</small></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="visual-story" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story" data-marpit-pagination="20" style="--paginate:true;--class:visual-story;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/web-extensibility-bg.png&quot;);filter:opacity(.5);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="visual-story" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story" data-marpit-pagination="20" style="--paginate:true;--class:visual-story;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="why-the-web-succeeded-1-extensibility">Why the Web succeeded (1): Extensibility</h1>
<p class="big story-definition">Adding the new<br />without breaking the old</p>
<div class="story-example">Add a new form, and browsers don't need an update</div>
<div class="story-mechanism"><b>Don't break</b> Ignore unknown tags, attributes, and headers<br /><b>Can add</b> Express new actions as links and forms, too</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="visual-story" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story" data-marpit-pagination="20" style="" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="21" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="adding-organization-as-an-author">Adding &quot;organization&quot; as an author</h1>
<div class="cols"><div class="card"><div class="card-h">HTML (what the browser sees)</div>
<div class="figure"><img src="figures/en/fig-author.svg" alt="Following the 'Author details' link works whether it leads to a person's page or an organization's page" /></div>
<div class="detail">
<p>It only assumes &quot;follow the link&quot; → <strong>just works</strong></p>
</div>
</div><div class="card"><div class="card-h gray">GraphQL</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-diff"> type Post {
<span class="hljs-deletion">-  author: User</span>
<span class="hljs-addition">+  author: Author</span>
 }
<span class="hljs-addition">+union Author = User | Organization</span>
</code></pre>
<div class="detail">
<p>It assumes &quot;<code>author</code> is a <code>User</code>&quot; → when the type changes, it <em>fails</em><br />→ fix the client and deploy at the same time</p>
</div></div></div>
<p class="lead">The difference is <strong>how much the client hard-codes</strong> about where to go next</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story public-web" data-marpit-pagination="22" style="--paginate:true;--class:visual-story public-web;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/uncontrolled-clients-bg.png&quot;);filter:opacity(.5);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story public-web" data-marpit-pagination="22" style="--paginate:true;--class:visual-story public-web;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="content">
<h1 id="why-the-web-succeeded-2-internet-scale">Why the Web succeeded (2): Internet scale</h1>
<p class="big story-definition">Not breaking when you talk<br />to parties you don't control</p>
<div class="story-example">Strangers can <strong>link to you without permission</strong></div>
<div class="story-mechanism">They follow those links across the organizational boundary = <strong>the trust boundary</strong></div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="visual-story public-web" data-theme="sonicgarden-en" data-lang="en" lang="en" class="visual-story public-web" data-marpit-pagination="22" style="" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="23" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="when-a-client-you-didnt-anticipate-shows-up">When a client you didn't anticipate shows up</h1>
<div class="cols"><div class="card"><div class="card-h">2005　Google Web Accelerator</div>
<div class="figure"><img src="figures/en/fig-prefetch.svg" alt="A prefetching tool follows every delete link (GET) on a list" /></div>
<p>Follows every link ahead of the user → <em>data deleted</em></p>
</div><div class="card"><div class="card-h">Today　Email security scanners</div>
<div class="figure"><img src="figures/en/fig-onetime.svg" alt="A scanner opens a one-time confirmation link first, and the user opens it later" /></div>
<p>Opens it before the user does → <em>used up, now invalid</em></p>
</div></div>
<div class="lead sm">
<p>If strangers will come, all you can rely on is the shared <strong>contract</strong> (HTTP semantics)<br />Break &quot;GET is safe&quot;<span class="note"> (requests no change)</span>, and it breaks even if you return HTML</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="24" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-2019-conclusion">The 2019 conclusion</h1>
<div class="cols w60"><div class="card"><div class="card-h gray">Challenges of a "true REST API" (2019)</div>
<p class="note" style="margin:0 0 6px">Achieve "extensibility" and "Internet scale" with a hypermedia API <strong>for programs</strong>, not HTML for browsers</p>
<ul>
<li>No single, clear standard hypermedia format like HTML</li>
<li>To automate the hypermedia choices humans made,<br />you need one of these
<ul>
<li>Give all the knowledge in advance</li>
<li>Read human language and understand its meaning</li>
</ul>
</li>
</ul>
<p class="green verdict">Not easy, for now</p>
</div><div class="center">
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="map" data-theme="sonicgarden-en" data-lang="en" lang="en" class="map" data-marpit-pagination="25" style="--paginate:true;--class:map;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="diagnosing-architectures">Diagnosing architectures</h1>
<table class="map"><thead><tr><th class="rowh">Architecture <span class="rep">Response representation</span></th><th>Extensibility<span class="n">New features, no update</span></th><th>Internet scale<span class="n">Built for strangers</span></th><th class="hide">Clients you<br />don't control</th></tr></thead><tbody><tr><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>"True REST API"<span class="rep hm">Hypermedia</span><br /><small>Hypermedia API for programs</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>Public API<span class="rep">JSON</span><br /><small>Run with versioning</small></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>Private / internal API<span class="rep">JSON</span><br /><small>React + API / in-house</small></td><td><span class="t">◐</span><span class="n">Assumes consumers update</span></td><td><span class="x">—</span><span class="n">Assumes you know your consumers</span></td><td class="hide">?</td></tr><tr><td>Client-integrated<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">Assumes forced updates</span></td><td><span class="x">—</span><span class="n">Dedicated clients only</span></td><td class="hide">?</td></tr></tbody></table>
<div class="footnote">
<p>Note: <strong>Forced update</strong> = updating clients together whenever the server changes. Possible with dedicated clients; not something you can ask of general-purpose clients like browsers<br />Note: The question is whether you chose that trade-off on purpose</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="section" data-theme="sonicgarden-en" data-lang="en" lang="en" class="section" data-marpit-pagination="26" style="--paginate:true;--class:section;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="what-if-a-program-could-dobrthe-picking-the-next-actionbrbrowsers-and-humans-did">What if a program could do<br />the &quot;picking the next action&quot;<br />browsers and humans did?</h1>
<p>Instead of a human, a program<br />
receives representations, interprets messages, and picks the next action</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="map" data-theme="sonicgarden-en" data-lang="en" lang="en" class="map" data-marpit-pagination="27" style="--paginate:true;--class:map;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="clients-you-dont-control--ai-agents">Clients you don't control = AI agents</h1>
<table class="map"><thead><tr><th class="rowh">Architecture <span class="rep">Response representation</span></th><th>Extensibility<span class="n">New features, no update</span></th><th>Internet scale<span class="n">Built for strangers</span></th><th class="open">AI agents<span class="n">Strangers, new<br />features, no update</span></th></tr></thead><tbody><tr><td>MPA<span class="rep hm">HTML</span><br /><small>Hotwire</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>"True REST API"<span class="rep hm">Hypermedia</span><br /><small>Hypermedia API for programs</small></td><td><span class="o">●</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>Public API<span class="rep">JSON</span><br /><small>Run with versioning</small></td><td><span class="x">—</span></td><td><span class="o">●</span></td><td class="hide">?</td></tr><tr><td>Private / internal API<span class="rep">JSON</span><br /><small>React + API / in-house</small></td><td><span class="t">◐</span><span class="n">Assumes consumers update</span></td><td><span class="x">—</span><span class="n">Assumes you know your consumers</span></td><td class="hide">?</td></tr><tr><td>Client-integrated<span class="rep">props / RSC Payload</span><br /><small>Inertia / Next.js RSC</small></td><td><span class="t">◐</span><span class="n">Assumes forced updates</span></td><td><span class="x">—</span><span class="n">Dedicated clients only</span></td><td class="hide">?</td></tr></tbody></table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="28" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="the-2019-conclusion-revisited">The 2019 conclusion (revisited)</h1>
<div class="cols w60"><div class="card"><div class="card-h gray">Challenges of a "true REST API" (2019)</div>
<p class="note" style="margin:0 0 6px">Achieve "extensibility" and "Internet scale" with a hypermedia API <strong>for programs</strong>, not HTML for browsers</p>
<ul>
<li>No single, clear standard hypermedia format like HTML</li>
<li>To automate the hypermedia choices humans made,<br />you need one of these
<ul>
<li>Give all the knowledge in advance</li>
<li><em>Read human language and understand its meaning</em></li>
</ul>
</li>
</ul>
<p class="green verdict">Not easy, for now</p>
</div><div class="center">
<div class="big">
<p>7 years later,<br />AI agents that<br /><em>read human language<br />and understand<br />its meaning</em><br />are real</p>
</div>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="29" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="two-ways-to-tell-ai-agents-what-they-can-do">Two ways to tell AI agents what they can do</h1>
<div class="cols"><div class="card"><div class="card-h">The hypermedia approach</div>
<ul>
<li>Each response shows<br /><strong>what you can do next</strong>, right there</li>
<li>Links and forms</li>
<li>The agent reads the &quot;menu&quot;<br />from the first half</li>
<li>Can be followed with no prior knowledge</li>
</ul>
</div><div class="card"><div class="card-h gray">The catalog approach</div>
<ul>
<li>Hand over a list of operations in advance</li>
<li>OpenAPI specs, MCP tool lists</li>
<li>The value of a standardized format</li>
<li>The <strong>client side</strong> holds the list<br /><span class="note">Here we compare a fixed spec handed over in advance</span></li>
</ul>
</div></div>
<div class="detail">
<blockquote>
<p>Clients cannot be expected to maintain knowledge of all servers. — Fielding (2000)</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="30" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="how-the-agent-works">How the agent works</h1>
<div class="flow wrap"><span><b>1</b> The LLM picks<br />target, method, representation</span><i></i><span><b>2</b> The program<br />sends the HTTP request</span><i></i><span><b>3</b> The response representation<br />(HTML/JSON) goes to the LLM as is</span><i></i><span><b>4</b> The LLM reads it and<br />picks the next action → back to 1</span></div>
<div class="cols" style="margin-top:28px"><div class="card"><div class="card-h">What it sees</div>
<ul>
<li><strong>Only the text of the response representation</strong></li>
<li><strong>Not</strong> an experiment in operating<br />by looking at browser screenshots</li>
<li>What humans do in a browser,<br />the LLM does by reading responses</li>
</ul>
</div><div class="card"><div class="card-h">What the LLM is given</div>
<ul>
<li>A system prompt</li>
<li>The tool <code>http_request</code> (takes a URL, method, and representation; returns the response)</li>
<li>Opening message: the instruction + the root URL or the spec</li>
</ul>
</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="sonicgarden-en" data-lang="en" lang="en" data-marpit-pagination="31" style="--paginate:true;--theme:sonicgarden-en;--lang:en;" data-marpit-pagination-total="56" data-transition-back="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;slide&quot;,&quot;duration&quot;:&quot;.4s&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
